[project]
name = "app"
version = "1.0.0"
description = "FastAPI backend for the GNL (Gym Newbie League) esports platform"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "pandas",
    "openpyxl",
    "python-dotenv",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2,<3",
    "pydantic>=2,<3",
    "pyjwt",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest",
    "ruff>=0.16.3",
    "rust-just>=1.58.0",
    "ty>=0.0.75",
]

[tool.ruff.lint]
extend-select = ["ANN", "N", "FURB"]  # annotations, pep8-naming, refurb

# Raised lint errors in legacy code that were suppressed rather than addressed.
ignore = [
    "BLE001",  # blind `except Exception`
    "DTZ001",  # naive datetimes match the DATETIME columns
    "N815",    # battleTag/discordTag columns mirror the wire format
    "PLW0211", # staticmethod argument named cls
    "RUF012",  # mutable class attribute default
    "S110",    # try-except-pass
    "TRY002",  # raise Exception
    "TRY004",  # fixing it changes the raised exception type
    "TRY401",  # redundant exception object in logging.exception
]

[tool.pytest]
testpaths = ["tests"]

# ty ratchet: rules at "ignore" still fail today; flip each to "error" once its
# diagnostics are fixed. The first three are SQLModel typing class attributes as
# instance values (User.id is `int | None`, not a column); the fix is sqlmodel.col().
[tool.ty.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
invalid-return-type = "error"
invalid-assignment = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
missing-argument = "ignore"
deprecated = "ignore"
