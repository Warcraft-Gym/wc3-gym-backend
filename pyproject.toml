[project]
# The name matches the app/ directory, so hatchling ships that directory as
# the package with no further build config.
name = "app"
version = "1.0.0"
description = "Flask REST API for the GNL (Gym Newbie League) esports platform"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "gspread",
    "pandas",
    "openpyxl",
    "python-dotenv",
    "apscheduler",
    "flask",
    "flask-cors",
    "flask-jwt-extended",
    "pyodbc",
    "pymysql",
    "sqlalchemy>=2,<3",
    "flasgger",
    "gunicorn",
    "flask-caching",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
# Findings in existing code, suppressed rather than fixed in the ruff
# rollout. To burn down: fix a rule's findings, then remove it from this list.
ignore = [
    "BLE001",  # blind `except Exception`
    "DTZ001",  # naive datetimes match the DATETIME columns
    "PLW0211", # staticmethod argument named cls
    "RUF012",  # mutable class attribute default
    "S110",    # try-except-pass
    "TRY002",  # raise Exception
    "TRY004",  # fixing it changes the raised exception type
    "TRY401",  # redundant exception object in logging.exception
]

[tool.pytest]
# Collect from tests/ only. A non-empty table here also anchors pytest's
# rootdir to this file, so a nested worktree never inherits the config of a
# checkout above it.
testpaths = ["tests"]
