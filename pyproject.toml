[project]
# The name matches the app/ directory, so hatchling ships that directory as
# the package with no further build config.
name = "app"
version = "1.0.0"
description = "FastAPI REST API for the GNL (Gym Newbie League) esports platform"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "gspread",
    "pandas",
    "openpyxl",
    "python-dotenv",
    "apscheduler",
    "pyodbc",
    "pymysql",
    "sqlalchemy>=2,<3",
    "pydantic>=2,<3",
    "pyjwt",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest",
    "ruff>=0.16.3",
    "rust-just>=1.58.0",
]

[tool.ruff.lint]
# Every function annotates its arguments and its return type. ruff reads
# requires-python above, so it accepts the syntax of that version and asks
# for nothing older.
extend-select = ["ANN"]

# Findings in existing code, suppressed rather than fixed in the ruff
# rollout. To burn down: fix a rule's findings, then remove it from this list.
ignore = [
    "BLE001",  # blind `except Exception`
    "DTZ001",  # naive datetimes match the DATETIME columns
    "PLW0211", # staticmethod argument named cls
    "RUF012",  # mutable class attribute default
    "S110",    # try-except-pass
    "TRY002",  # raise Exception
    "TRY004",  # fixing it changes the raised exception type
    "TRY401",  # redundant exception object in logging.exception
]

[tool.ruff.lint.per-file-ignores]
# The validators here run before pydantic has checked anything, so the
# value they take really is arbitrary: a request body, or a cell from the
# xlsx import. Any is the honest annotation for it.
"app/models/types.py" = ["ANN401"]

[tool.pytest]
# Collect from tests/ only. A non-empty table here also anchors pytest's
# rootdir to this file, so a nested worktree never inherits the config of a
# checkout above it.
testpaths = ["tests"]
