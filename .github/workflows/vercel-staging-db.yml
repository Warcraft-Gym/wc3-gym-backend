name: Vercel staging database

# The staging Supabase project follows main: wc3gym_template and wc3gym_staging migrate on every
# push to main. A branch's own copy is dropped by vercel-staging-db-drop.yml. See docs/PREVIEW-DATABASES.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewer:
        description: Reseed staging and build the review season against this Discord id
      me:
        description: Your Discord id, the other side of the review season

jobs:
  migrate:
    if: github.repository == 'Warcraft-Gym/wc3-gym-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python scripts/vercel_staging_db.py migrate
        env:
          DB_URL: ${{ secrets.VERCEL_STAGING_DB_URL }}
  staging-branch:
    if: github.repository == 'Warcraft-Gym/wc3-gym-backend'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:staging
  # By hand, with both ids filled in: reseed the template and the shared database from the seed repo,
  # upload the logos, then build the review season. Drops every row staging holds, review season included.
  seed:
    if: github.repository == 'Warcraft-Gym/wc3-gym-backend' && inputs.reviewer != '' && inputs.me != ''
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_STAGING_DB_URL: ${{ secrets.VERCEL_STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # the read-only deploy key of the seed repo; _fetch-seed clones over SSH with it
      - run: |
          test -n "$SEED_DEPLOY_KEY" || { echo "SEED_DEPLOY_KEY is not set (the seed repo's read-only deploy key)" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SEED_DEPLOY_KEY" > ~/.ssh/seed_deploy_key
          chmod 600 ~/.ssh/seed_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/seed_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
        env:
          SEED_DEPLOY_KEY: ${{ secrets.SEED_DEPLOY_KEY }}
      - run: uv run just vercel seed staging
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - run: uv run just vercel review-season staging "$REVIEWER" "$ME"
        env:
          REVIEWER: ${{ inputs.reviewer }}
          ME: ${{ inputs.me }}
