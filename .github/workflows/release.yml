name: Release

# A published GitHub Release moves the `release` branch to the tagged commit; Vercel builds production
# from `release`, and a push to main builds only the staging preview. Only a commit on main ships, and
# `release` only moves forward, so a rollback goes through Vercel. A pre-release ships nothing.
on:
  release:
    types: [published]

concurrency: release

jobs:
  release-branch:
    if: github.repository == 'Warcraft-Gym/wc3-gym-backend' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a commit on main ships
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Move release to the tagged commit
        run: git push origin "$GITHUB_SHA:refs/heads/release"
