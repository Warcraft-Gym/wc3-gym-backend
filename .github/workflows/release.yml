name: Release

# A published GitHub Release tagged vYYYY.MM.DD.N on a commit on main deploys that commit to production:
# Vercel builds it from GitHub, and the job waits until production serves it. A merge to main builds only
# staging, and a pre-release ships nothing. VERCEL_RELEASE_TOKEN is a repository secret: a token scoped to this
# repository's Vercel project.
on:
  release:
    types: [published]

concurrency: release

jobs:
  production:
    if: github.repository_owner == 'Warcraft-Gym' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only a calendar version on main ships
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vYYYY.MM.DD.N"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build production on Vercel and wait until it serves
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_RELEASE_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          body=$(jq -n --arg repo "$REPO" --arg sha "$GITHUB_SHA" '{name: $repo, project: $repo, target: "production",
            gitSource: {type: "github", org: "Warcraft-Gym", repo: $repo, ref: "main", sha: $sha}}')
          id=$(curl -sS --fail-with-body -X POST "$api/v13/deployments?forceNew=1" \
            -H "$auth" -H "Content-Type: application/json" -d "$body" | jq -er .id)
          echo "Vercel deployment $id"
          for _ in $(seq 90); do
            state=$(curl -sS --fail-with-body "$api/v13/deployments/$id" -H "$auth" | jq -r .readyState)
            echo "$state"
            case "$state" in
              READY) exit 0 ;;
              ERROR | CANCELED | BLOCKED) exit 1 ;;
            esac
            sleep 10
          done
          echo "not ready after 15 minutes"
          exit 1
