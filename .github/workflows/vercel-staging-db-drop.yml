name: Vercel staging database drop

# Drops wc3gym_<branch> when GitHub deletes the branch. Needs delete-branch-on-merge on the repo,
# or a manual branch delete; a merge alone fires nothing. See docs/PREVIEW-DATABASES.md.
on:
  delete:

jobs:
  drop-branch-copy:
    if: github.repository == 'Warcraft-Gym/wc3-gym-backend' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python scripts/vercel_staging_db.py drop-branch "${{ github.event.ref }}"
        env:
          DB_URL: ${{ secrets.VERCEL_STAGING_DB_URL }}
