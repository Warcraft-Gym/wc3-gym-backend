name: Staging image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'tanghyd/wc3-gym-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push
        run: |
          image=ghcr.io/tanghyd/gnl-backend
          sha=$(echo "${{ github.sha }}" | cut -c1-8)
          docker build -t "$image:staging" -t "$image:sha-$sha" .
          docker push "$image:staging"
          docker push "$image:sha-$sha"
