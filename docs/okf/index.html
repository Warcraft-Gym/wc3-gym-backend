 same tables; one Alembic head |\n| `test_error_envelope.py` | every error answers `{\"error\": ...}` and a 500 exposes nothing |\n| `test_public_contract.py` | the fields the WordPress shortcodes read from eight routes |\n| `test_contract.py` | the fields the offline leaderboard reads |\n| `test_gnl_snapshot.py` | the GNL season payloads, byte for byte, against `tests/data/gnl_snapshot.json` |\n| `test_query_budget.py` | the number of SQL statements one list answer costs is a constant |\n| `test_memory_budget.py` | the peak memory of the fantasy bets list |\n| `test_blob_budget.py` | no mapped binary column exists; a picture is a URL |\n| `test_natural_keys.py` | the unique keys the importers match on |\n| `test_utc_default.py` | every datetime is aware UTC on every dialect |\n| `test_achievement_parity.py` | the SQL achievement rules and the Python oracle agree on the same boundary cases |\n| `test_paging.py` | every paged route, its default order and its sort names |\n\n# Oracles\n\nSome rules have two faces: SQL for aggregates and Python for loaded rows, or a Python oracle in `tests/` beside a SQL rule in `app/core`. A boundary test proves nothing about production when it drives only the copy. Feed the boundary cases through both faces. See [the pitfall](../pitfalls/test-drives-the-oracle.md).\n\n# Real data\n\n`tests/data/` holds two season workbooks and captured W3Champions pages. The workbook round trip and the ladder parser run against them, so a change to the import or the sync is checked against the real shapes.", "data/migrations": "# Rules\n\n- `alembic upgrade head` is the only thing that builds or changes the schema. The application never creates a table. The URL comes from `DB_URL`, the same variable the app reads.\n- Each revision commits on its own, so a revision that adds an enum value can be followed by one that uses it.\n- `tests/test_migrations.py` compares the migrated schema with the models, strictly, and fails on two heads.\n- Write a migration with `uv run just local revision \"message\"` and read what autogenerate wrote: it also drops what the models no longer declare.\n\n# Expand, then contract\n\nThe production build runs the migration while the previous deployment keeps serving. A migration therefore works with the code before it and after it:\n\n1. Add a column nullable or with a server default. Rename a table by creating the new one and leaving a view under the old name.\n2. Ship the code that reads the new shape.\n3. Drop the old column or view in a later pull request, merged after step 2 is live.\n\nThe schema parity test is strict, so an unread column stays declared on the table class until the drop pull request. See [the pitfall](../pitfalls/column-drop-two-deploys.md).\n\n# Heads\n\nTwo pull requests that each add a migration on the same parent produce two heads on `main` after the second squash, which breaks CI and the staging migrate job. One migration in flight at a time. After merging `main` into a branch that carries a migration, run `uv run alembic heads` and re-point the revision. See [the pitfall](../pitfalls/alembic-two-heads.md).\n\n# Where migrations run\n\n| Where | How |\n|---|---|\n| tests | on a temporary SQLite file, every run |\n| local Docker | at every container start; a start with nothing to do logs no `Running upgrade` line |\n| Vercel production | in the build command, before the new code is promoted; a failed migration stops the deploy |\n| Vercel preview | in the build, against the branch's own copy of the staging template when the branch adds a migration, else the shared staging database. See [preview databases](../../PREVIEW-DATABASES.md). |\n| staging template and shared database | a workflow on every push to `main` |\n\n# Before a drop in production\n\nThere is no scheduled backup. Take a `pg_dump` by hand from a machine that holds the URL before any migration that drops or changes a column. See [backup and restore](../runbooks/backup-and-restore.md).\n\n# SQLite\n\nThe tests run on SQLite, which needs a batch rebuild for some alterations. Never batch-alter `users` on SQLite: it drops the expression index on the Discord tag.", "data/model-families": "# One family per entity\n\n| Class | Role |\n|---|---|\n| `XBase(SQLModel)` | the fields shared by the table and the shapes |\n| `X(XBase, DBModel, table=True)` | the table. `id: int | None` because a row exists before the database assigns its key. Relationships live here. |\n| `XCreate(XBase)` | what a client sends to create. Required fields are required here. Never carries `id`. |\n| `XUpdate(SQLModel)` | every field optional. The service applies `model_dump(exclude_unset=True)`, so a key left out keeps its stored value. |\n| `XPublic(XBase, PublicModel)` | what the API answers. `id: int` because the client can rely on it. Derived fields are filled by `app/services/derived.py`. |\n\nAn update path takes an `XUpdate` built from the fields it means to change, never an `XPublic` read back. One schema doing create, update and response duty wiped columns silently; see [the pitfall](../pitfalls/one-schema-wipes-columns.md).\n\nSome tables have only a table class and a Public class (`League`, `EventStage`, `EventEntrant`) with `Write` shapes for the admin forms. Join tables are named `DB*` (`DBTeamSeason`, `DBUserTeamSeason`, `DBEventRound`) and carry no Public shape of their own.\n\n`DBModel` holds the shared query helpers (`getById`, finders); `PublicModel` also answers a plain dict. `Stored` is a protocol for a mapped row whose id is set, and `ident()` types it.\n\n# Validators\n\n`app/models/types.py` holds the validators the shapes reuse as `Annotated` markers: `NumToStr` (the workbook import sends numeric cells), `LenientDate`, `MapRules`, `KnownScoreSystem`, `KnownTimeZone`, `SuggestRace`, `EnumValue`, `NoneToList`, `EmptyStrToNone`, `TwitchChannel`, `YouTubeChannel`. A validator's input is public JSON, so it takes any value and hands an unknown one back for pydantic to refuse with a 422.\n\n# Datetimes\n\nEvery stored datetime is `timestamptz` through `UTCDateTime`, and every input field is `AwareUTC`: a bare value is read as UTC, a zoned value is converted, and a stored value reads back aware on SQLite and Postgres alike. Responses end in `Z`. `utcnow()` in `types.py` is the one clock. See [the pitfall](../pitfalls/datetimes-are-utc.md).\n\n# Relationships\n\nA relationship names its foreign keys as a string when SQLAlchemy needs them, `\"[Series.match_id]\"`, and `tests/test_models.py` resolves every one so a wrong name fails as a test and not as a request. Loader options are pinned per Public shape (`_eager_options`) and the query budget test counts them. Two sibling eager loads run in hash order, so a test that captures SQL treats the statements after the first as a set.\n\n# Pictures are URLs\n\nNo mapped column holds bytes. `teams.icon_url` and `maps.image` hold public URLs into the blob store. `tests/test_blob_budget.py` fails on any binary column. See [pictures and replays](../concepts/pictures-and-replays.md).\n\n# Response annotation is the response model\n\nFastAPI builds the response model from a handler's return annotation and re-serializes every body with it. A union that mixes a `Response` with anything else fails at import. A handler that answers a `Response` or a plain dict on different paths carries `response_model=None`.", "data/tables": "# Schema\n\n## People and access\n\n| Table | Class | Holds |\n|---|---|---|\n| `users` | `User` | a player: name, battle tag, Discord tag and id, main race, MMR, country, time zone, channels, avatar, ban date, two sync stamps |\n| `clerk_account` | `ClerkAccount` | Clerk user id to Discord id, written by the first request of a login |\n| `admin_grant` | `AdminGrant` | who administers the site, beside `ADMIN_DISCORD_IDS` |\n| `settings` | `Settings` | the key-value rows; see [settings](../concepts/settings-and-current-season.md) |\n| `user_block` | `UserBlock` | a standing weekly block, local time and zone |\n| `user_busy` | `UserBusy` | a one-off busy range |\n\n## Leagues and events\n\n| Table | Class | Holds |\n|---|---|---|\n| `league` | `League` | what repeats: name, short name, kind, entrant kind, links |\n| `event` | `Season` | one run of a league; the GNL season columns plus the event columns |\n| `event_stage` | `EventStage` | one format over the entrants, with its rules |\n| `event_round` | `DBEventRound` | one round: number, date window, fixed map |\n| `event_division` | `EventDivision` | one MMR band that runs the event on its own |\n| `event_entrant` | `EventEntrant` | a player or team in an event, with race, seed, division, check-in, withdrawal |\n| `event_award` | `EventAward` | the frozen places of a finished event |\n| `matches` | `Match` | a fixture: two teams in one round, optional fixed map |\n| `series` | `Series` | one series: two players or two entrants, scores, time, host, off races, result kind, feeders |\n| `series_side` | `SeriesSide` | the players of one side when a side holds more than one |\n| `series_game` | `DBSeriesGame` | one game: winner side and map |\n| `series_replay` | `DBSeriesReplay` | one replay slot per game, keyed into the bucket |\n| `series_veto_step` | `DBSeriesVetoStep` | one taken veto step, with who entered it |\n| `series_cast` | `SeriesCast` | a caster's claim on a series, channel and VOD |\n| `draft_series` | `DraftSeries` | a captain's proposed series before an admin promotes it |\n| `round_availability` | `DBRoundAvailability` | a player's answer for one round |\n\n## Teams and rosters\n\n| Table | Class | Holds |\n|---|---|---|\n| `teams` | `Team` | a team: name, long name, logo URL |\n| `team_season` | `DBTeamSeason` | a team in a season, with its Discord role and coaches |\n| `team_season_captain` | `DBTeamSeasonCaptain` | a captain seat |\n| `user_team_season` | `DBUserTeamSeason` | a roster row |\n| `user_season_signup` | `DBUserSeasonSignup` | a signup: race, MMR, draft position, fantasy tier |\n\n## Maps\n\n| Table | Class | Holds |\n|---|---|---|\n| `maps` | `Map` | a map: name, picture URL, ladder facts |\n| `map_season` | `DBMapSeason` | a season's ordered pool |\n\n## Fantasy\n\n| Table | Class | Holds |\n|---|---|---|\n| `fantasy_teams` | `FantasyTeam` | a Fantasy Captain's team for one season: drafted team, race, grind pick |\n| `fantasy_team_player` | `DBFantasyTeamPlayer` | a drafted player |\n| `fantasy_bets` | `FantasyBet` | a stake on one series and a call |\n\n## W3Champions\n\n| Table | Class | Holds |\n|---|---|---|\n| `w3cstats` | `W3CStats` | per player, race and W3Champions season: MMR, wins, losses |\n| `w3c_ladder_matches` | `W3CLadderMatch` | one ranked 1v1 match per GNL player, both races per side |\n| `ladder_sync` | `LadderSync` | the (player, season) ledger of the match sync |\n| `ladder_achievements` | `LadderAchievement` | a badge price for one season, or lifetime |\n| `player_career_stats` | `PlayerCareerStats` | identity plus the historical baseline columns from before the app; the totals derive |\n\n## Discord\n\n| Table | Class | Holds |\n|---|---|---|\n| `discord_role_binding` | `DiscordRoleBinding` | a role kind and scope bound to a guild role |\n| `discord_role_hidden` | `DiscordRoleHidden` | a guild role the binding page hides |\n| `discord_post` | `DiscordPost` | a card the app posted and may edit |\n\n# Views left for a deploy\n\nA migration that renames a table leaves a view under the old name for one deploy, because the previous code keeps serving during the production build. The view is dropped in the next migration. See [migrations](migrations.md).", "decisions/app-managed-roles": "# Decision\n\nAn admin is a database grant or a bootstrap id. A captain is a seat. Discord grants nothing: the guild owner, the administrator bit and the old admin role setting all read as members. Season-specific Discord roles (team, captain, participant, fantasy, champion) are bound to guild roles and synced on a button press; admin and coach roles are hand-managed in the guild and outside the sync.\n\n# Why\n\nAccess must not depend on Discord roles, and an automatic sync would churn people's Discord roles while an admin is still reassigning teams.\n\n# Consequences\n\n- Never add a Discord read that grants a role. A new role is a binding kind plus a database fact.\n- Never make the sync automatic, and never let it touch admin or coach roles.\n- A binding carries a scope: current season, one season, or all seasons. Teams and captains default to all, players and fantasy to current, champions to one season.\n- The sync grants and revokes only the bound season roles. A role shared with people who hold no seat needs an additive-only binding before it is synced.", "decisions/availability-blocklist": "# Decision\n\nPlayers state when they cannot play. There is no preferred time, no category of block, no inference from ladder activity. Blocks and one-off busy dates are time ranges in local time with a zone. A block never writes a round answer, never reorders a pairing and never refuses a time.\n\n# Why\n\nThe league ran the obvious poll of best times for many seasons and dropped it: a statement of being busy is a fact, and a statement of being free is not.\n\n# Consequences\n\n- Never add a preferred state or a block category.\n- Everything on a scheduling screen is a counted figure, never a judgement.\n- The unit of the availability question is the round.\nSee [scheduling and availability](../concepts/scheduling-and-availability.md).", "decisions/bo3-only": "# Decision\n\nThe format select was removed from the season maps page. `Season.map_rules` and the stage's `best_of` keep every scoring rule and screen general, for community events.\n\n# Why\n\nA Bo5 is very unlikely for GNL: a Bo3 already strains everyone's calendar. Keeping the general support costs nothing and serves the events module.\n\n# Consequences\n\n- Do not add a best-of choice to a GNL screen, and do not reopen the Bo5 question.\n- A community event that needs a longer format needs only the select back.", "decisions/clerk-auth": "# Decision\n\nAuthentication is Clerk: the OAuth exchange with Discord, the session token, its refresh and its revocation. The backend verifies the session with the Clerk SDK and then resolves the Discord id, the guild membership and the role itself. The admin token login stays for the admin UI and scripts.\n\n# Why\n\nThe maintainers want a library to own session management rather than a custom token and cookie stack to support.\n\n# Consequences\n\n- Do not re-argue direct OAuth against Clerk.\n- Keep the guard ladder `require_login < require_member < require_admin` and the guild read as app code. Only the token is Clerk's.\n- Production runs the Clerk production instance in proxy mode through the frontend; previews and local use the dev instance. A preview must never point at the production backend.\n- The Clerk user to Discord id link is one row, written on the first request of a login and read after that.\n- Battle.net linking, when it comes, is a custom OIDC connection on Clerk.", "decisions/derived-not-stored": "# Decision\n\nMade 2026-08-19 and extended the same week to career and fantasy totals; the last stored rollup (per-player games, wins and losses) went on 2026-08-26. The rule lives once in `app/core/`, with a Python face and a SQL face pinned to each other, and `app/services/derived.py` fills every answer in a constant number of statements.\n\n# Why\n\nStored derived values caused a recalculate button people forgot to press, a bug that wiped columns to null, write races between two recalculations, and stale numbers after every import. A read-time value is right by construction, and an import of any shape is safe without a step after it.\n\n# Consequences\n\n- Never add a stored points, score, rating or total column, and never a recalculate route.\n- A new derived value goes in `derived.py` with a query-budget test.\n- A cache is fine where a rollup was not: it is bounded by its TTL. Put it at the HTTP layer when public traffic asks for it, never in the database.\nSee [derived scores](../concepts/derived-scores.md).", "decisions/discord-adapter-separate": "# Decision\n\nDiscord posts to the adapter in `wc3-gym-discord-bot`, which checks the signature, answers a deferred reply inside Discord's 3 second window, and forwards the payload to `POST /discord/interactions`. The backend checks the signature again and runs the command. The adapter holds no bot token and knows no command.\n\n# Why\n\nMeasured after idle, a one-file Python function cold-starts in about 0.85 s and the backend app in about 4 s, past Discord's window. The Vercel FastAPI preset builds one function and does not build a second file, so the adapter cannot live in this project. Starlette was chosen over FastAPI for the adapter because FastAPI's import alone costs 0.4 s.\n\n# Consequences\n\n- The command list and every reply live here; the adapter changes only when the handshake changes.\n- A Starlette background task on the response is the after-response hook on Vercel Python; the forward runs there within the 60 second limit.\n- Autocomplete has no deferred form; the adapter waits 2 seconds and answers an empty list on a timeout.", "decisions/discord-rate-limit": "# Decision\n\n`discord_posts.refresh_series` claims an edit with one UPDATE, waits when the channel had an edit in the last second, retries a bounded number of times, and skips a post already edited after its latest change. `discord._channel_call` waits out one 429.\n\n# Why\n\nEight veto steps in two seconds edited every card eight times; Discord refused past the limit and a refused edit was lost.\n\n# Consequences\n\n- A new post or edit goes through `discord_posts`, or at least `discord._channel_call`.\n- Never a loop of edits per write, never an in-memory queue or lock: no process survives a request on Vercel.", "decisions/draft-order-rerank": "# Decision\n\n`user_season_signup.draft_position` holds a hand-set place; null means sort by MMR. The order composes over every signup, and a reversed sort keeps the relative order.\n\n# Why\n\nA number that pretends to be an MMR drifts from the real one and reopens the old GNL-MMR versus W3Champions-MMR problem. A player can be moved without being given a rating.\n\n# Consequences\n\n- Never add an override MMR.\n- Before building a draft or ranking feature, read this and the season concept first.", "decisions/koth-multi-entry": "# Decision\n\nThe entrant unique key widens from (event, user) to (event, user, race). A per-event switch, off by default and on for KOTH nights, allows the second row. Rows in the same bracket show once with the races as sub-rows. The chain draw gives a player one place and never pairs them with themself.\n\n# Why\n\nThe unified entrant table had folded KOTH to one row per player per night. Multi-division entry is the feature; divisions are parallel, so a player in two never meets themself.\n\n# Consequences\n\n- The \"races I may swap to\" list for GNL is later; the per-series off race already records a swap.", "decisions/off-race-per-series": "# Decision\n\nThe signup race is the season race and never changes mid-season. A series stores `player1_off_race` / `player2_off_race` (null means the signup race) and answers the resolved `player1_race` / `player2_race` read-only.\n\n# Why\n\nA series recorded as one race when another was played is wrong data. A per-series fact after the game keeps bets, leaderboards and tiers consistent without a formal race change. Two names exist because two callers re-send the whole object; one shared name would pin the resolved race into the column.\n\n# Consequences\n\n- Never propose a dated race-change table or a mid-season signup race edit.\n- Per-game race stays out until replay parsing exists.\n- Season pages read the signup race alone, never `coalesce(signup_race, profile race)`: the profile race says nothing about a season.", "decisions/pictures-as-urls": "# Decision\n\nMade 2026-09-02. `teams.icon` was dropped; `teams.icon_url` and `maps.image` hold URLs. The in-app upload button stays, because a season is set up without a developer.\n\n# Why\n\nA bytes column on the team row was read by every query that touched a team. One season page read 29.7 MB to answer 139 KB, and database egress is the metered cost. A bundled-logo frontend was reverted for the same reason: the picture must be replaceable without a deploy.\n\n# Consequences\n\n- `tests/test_blob_budget.py` fails on any binary column. Keep it.\n- A replacement gets a new URL and deletes the old blob; a seed never copies a production URL.\nSee [pictures and replays](../concepts/pictures-and-replays.md).", "decisions/reads-open-writes-admin": "# Decision\n\nRead routes serve guests, members and admins alike. Write routes keep `require_admin`, except a member's own flows, which the service checks for ownership. The frontend hides a write's button behind the role rather than letting the call fail.\n\n# Why\n\nThe admin gates on reads were leftovers from before Clerk. Hiding the button matters because the frontend's fetch wrapper ends the session on a 401; a visible button that fails would log people out.\n\n# Consequences\n\n- A new GET needs no guard unless it answers something personal.\n- A sync or import stays admin-only in the route and in the button.\n- Ownership is a row check in the service, never a role. See [roles](../concepts/roles-and-permissions.md).", "decisions/season-boundary-manual": "# Decision\n\n`current_w3c_season` stays a stored row. The derived default (the newest season from the API) applies only when the row is missing.\n\n# Why\n\nThe derived value is wrong exactly when it would look smartest: the day a new season opens, every player has zero games in it, and every MMR column would go blank. Season management at the boundary is not a solved problem; relying on a human edit a few times a year is fine.\n\n# Consequences\n\n- Never propose auto-following the latest season, a staleness warning, or clearing the row.\n- A stored value wins over a derived one, always.\nSee [settings](../concepts/settings-and-current-season.md).", "decisions/unified-event-model": "# Decision\n\nOne set of tables (league, event, stage, round, division, entrant, fixture, series, side, game) serves every kind of event. GNL keeps its draft, its captains' series draft and its fantasy game in their own services; KOTH keeps its night, its Twitch signup and its legacy payloads under `app/services/koth/`. The shared services and the stage engine read the rows and never test the kind.\n\n# Why\n\nThe GNL season already ran unchanged on the renamed tables, pinned by the snapshot test. The features the maintainers want cross kinds: one upcoming list, one player history and head-to-head across every event, one check-in, one series, replay, cast and veto pipeline, one standings engine, one Discord post pipeline. A second schema would duplicate all of them. The real risk, complexity mixing, is answered by the no-branching rule, not by a second model.\n\nOne data model serves every kind; behaviour that differs by kind lives in a kind module.\n\n# Consequences\n\n- Never `if kind == \"gnl\"` inside a shared service. Put the behaviour in the kind module.\n- A kind that needs its own columns gets a one-to-one side table when the columns get in the way, not before. Today the GNL-only columns still sit on the event row.\n- Every shared-table migration keeps `tests/test_gnl_snapshot.py` green.\n- External Discord servers are out of scope; a merged playoff across divisions is never a rule in the app.", "decisions/vercel-and-supabase": "# Decision\n\nSince 2026-08-30 the live backend is this repository on Vercel, with the database on Supabase. The older self-hosted line (a Docker Compose stack on an Azure VM, reached through Portainer) is frozen in a fork and this repository does not support it. Never plan a Docker, nginx or VM fallback here; a leftover such as the Dockerfile only serves local development.\n\n# Why\n\nThe self-hosted line was deployed by hand on a shared machine. Vercel builds every merge and every pull request; Supabase runs Postgres without a server to keep. Clerk sessions and the Discord roles made the Vercel line diverge from anything that could merge back.\n\n# Consequences\n\n- One function serves every route; a second Python file in `api/` is not built. A separate small service is a separate project, which is why the Discord adapter is its own repository.\n- The function limit is 60 seconds and the Hobby plan runs one cron a day. See [jobs](../api/jobs.md).\n- The database is reached through the transaction pooler on port 6543. See [the pitfall](../pitfalls/transaction-pooler.md).\n- The Supabase free plan meters egress across every service; bytes leaving the database are the cost to watch. See [the pitfall](../pitfalls/blob-egress.md).\n- Vercel and Supabase sit in the same US East region on purpose; the first project sat in Europe and cost about 80 ms per statement.", "decisions/veto-warns-never-blocks": "# Decision\n\nThe veto is not a required input. A report without one gets a warning, possibly two, saying a veto really should be included. Each game is marked with a win and a loss, the replay upload sits beside its game, and a parser ticks the map and warns on a disagreeing winner without blocking.\n\n# Why\n\nA report is never blocked because a player lacks the recording or the veto went wrong. A series score alone is ambiguous at the game level: a third of GNL series go to a deciding game.\n\n# Consequences\n\n- Build the report against this. The open question is the wording of the warning, not whether it blocks.\n- The board is still the one place a veto exists; a veto done elsewhere is entered after the fact on it, with who entered it.", "log": "# Bundle history\n\n## 2026-09-14\n\n* **Creation**: Established the bundle: conventions, concepts, data, api, runbooks, decisions and pitfalls, written from the code on `main`, the repository documents, and the maintainers' recorded decisions. Every concept is `generated` by an agent and carries no `verified` entry yet.\n", "overview": "# What it is\n\nThe one backend of the Gym Newbie League (GNL) and the other Warcraft Gym events: players, teams, seasons, series, results, the fantasy game, King of the Hill nights, the W3Champions ladder mirror, and the Discord commands and cards. It is a FastAPI application on SQLModel and Postgres, deployed as one Vercel function, with Clerk sessions for members and a shared admin token for the admin UI and scripts.\n\n# Where it runs\n\n| Target | What |\n|---|---|\n| production | Vercel project `wc3-gym-backend`, built from `main`, database on the production Supabase project through the transaction pooler |\n| staging | the `staging` branch, force-pushed to the merged commit on every push to `main`; a preview at a fixed alias against the shared staging database |\n| previews | every pull request; a branch that adds a migration gets its own copy of the staging database |\n| local | `uv run just up` (Docker) or `uv run just serve` (the Vercel entry point from the working tree) |\n\nThe Azure VM and Docker Compose paragraphs in the README describe the older self-hosted line; this repository no longer supports it.\n\n# Layout\n\n```\napi/        the Vercel entry point and the preview-database choice\napp/\n  main.py   create_app: engine, routers, error handlers\n  api/      deps.py (guards, services), routes/ (one module per area)\n  core/     engine, query language, exceptions, security, the pure rules\n  services/ one service per entity; derived.py computes scores at read time\n  models/   SQLModel table classes and their Create, Update and Public shapes\nmigrations/ Alembic\ntests/      pytest, on a migrated SQLite file\njust/       one module per place the backend runs: local, azure, vercel\ndocs/       PICTURES.md, PREVIEW-DATABASES.md, and this bundle\n```\n\n# Start here\n\n1. [Vocabulary](concepts/vocabulary.md), then [GNL season](concepts/gnl-season.md) and [events module](concepts/events-module.md).\n2. [Layering](conventions/layering.md), [model families](data/model-families.md), [API overview](api/overview.md), [authentication](api/auth.md).\n3. [Run locally](runbooks/run-locally.md), [testing](conventions/testing.md).\n4. Before a change: [git and pull requests](conventions/git-and-pull-requests.md), the [decisions](decisions/index.md) and the [pitfalls](pitfalls/index.md).\n\n# Contributing\n\nThe maintainers build with AI coding agents and review every pull request before it merges. A contributor who reads this bundle and the code, works on a fork or a branch, and opens a small pull request is the expected path in.", "pitfalls/alembic-two-heads": "# What happened\n\nTwo pull requests wrote a migration against the same revision. Both were approved and both squash-merged. `alembic upgrade head` refused on `main`, CI went red and the staging migrate job failed until a third pull request re-pointed one revision.\n\n# The rule\n\nOne migration in flight at a time. After merging `main` into a branch that carries a migration, run `uv run alembic heads`; re-point the revision and commit before pushing. The preview build refuses a branch that does not know the shared database's revision, which catches the same thing earlier.", "pitfalls/blob-egress": "# What happened\n\n`Team.icon` was a plain bytes column. Measured on the wire, `/series/season/2` read 21.9 MB to answer 190 KB, and `/teams/season/2` read 7.8 MB to answer 70 KB. The statement-count test passed the whole time: an N+1 that re-reads a blob shows in neither statements nor response sizes. Supabase meters bytes leaving the database, so this was the cost driver. A bytes column also crosses the wire as hex, doubling it.\n\n# The rule\n\n- A picture is a URL. `tests/test_blob_budget.py` fails on any mapped binary column; keep it.\n- Measure this class of problem with a byte-counting relay in front of Postgres, never by reading response sizes.\n- The older self-hosted backend serves the WordPress site from another host; never scale a production figure from that host.", "pitfalls/column-drop-two-deploys": "# What happened\n\nA pull request created `series_cast` and dropped `series.caster` in the same migration. The old code's `SELECT series.*` would have failed for the whole build window. It was caught before the merge and split: create and copy first, drop in a later pull request merged after the first was live.\n\n# The rule\n\nAny `drop_column`, table drop or type change goes in its own pull request, merged only after the previous deploy is live. Keep the unread column declared on the table class until the drop, because the schema parity test is strict. Take a `pg_dump` first. A renamed table leaves a view under the old name for one deploy. See [migrations](../data/migrations.md).", "pitfalls/datetimes-are-utc": "# What happened\n\nA stale log line once claimed the series time was stored as Eastern time; the backend stores what it is handed and the frontend sends UTC. A zone read off a comment instead of the write path leads to migration work that is not needed. The public site's shortcode added five hours to every series time on the same false premise. Reading a season window in the wrong zone changes the ladder results of about one player in seven.\n\n# The rule\n\n- Every stored datetime is `timestamptz`; every input is aware UTC through `AwareUTC`; responses end in `Z`.\n- Before believing a comment about a zone, find the write path.\n- Rows from a workbook import carry whatever zone the sheet used; spot-check before assuming.", "pitfalls/edge-cache-cors": "# What happened\n\n`GET /seasons/{id}/ladder` sets `Cache-Control: public, s-maxage=...`. Starlette's CORS middleware adds `Access-Control-Allow-Origin` only when the request carries an `Origin`, and with every origin allowed it adds no `Vary: Origin`. A fill by curl, a bot or an uptime check stored a copy with no CORS header. Browsers then read that copy and blocked it; Firefox reported `NetworkError when attempting to fetch resource`, which reads like a dead server. The entry healed when the cache expired and broke again on the next non-browser fill.\n\n# The rule\n\nA route that sets `Cache-Control: public` writes `Access-Control-Allow-Origin: *` itself, beside it. Test it with a client that sends no `Origin`. Reproduce with a cache-buster query so the real key is untouched. The frontend sends no bearer on that route, because a request with an Authorization header is never cached.", "pitfalls/env-loading-in-tests": "# What happened\n\n`create_app` and the migration environment called `load_dotenv()`. In a worktree under the checkout that walked up to a `.env` above it. The suite then made real Discord calls, and the outbound-call guard failed 62 tests, only where such a file existed.\n\n# The rule\n\n- A `.env` file is read only at the entry points: `api/index.py` and the `just` modules. `create_app` reads the process environment.\n- An environment key that turns a network call on is removed in `tests/conftest.py` at import. Add a new one there when the guard starts refusing calls.\n- Never add `load_dotenv` to a module the tests import.", "pitfalls/hobby-cron-daily": "# What happened\n\nThree merges produced no deployment at all. The GitHub status said only \"Deployment failed\". A CLI deploy printed the cause: Hobby accounts are limited to daily cron jobs, and the schedule ran every six hours.\n\n# The rule\n\nOne daily schedule in `vercel.json`. Anything more frequent runs from outside against a `/jobs` route. After any merge that touches `vercel.json`, read the commit status; a failed Vercel context with no deployment row means the deployment creation failed, not the build. See [jobs](../api/jobs.md).", "pitfalls/ladder-egress": "# What happened\n\nMeasured on production with `pg_stat_statements`: about 230 of 311 MB of query results came from `w3c_ladder_matches`. A season ladder view read every match in the window, about 1.4 MB, and four pages loaded it. The per-player dedupe read on sync fetched all of a player's stored ids to skip a handful of new matches.\n\n# The rule\n\n- Derive badges and totals in SQL, which is what the achievement rules do now, so a read returns badges, not matches.\n- Scope a dedupe read to the ids in hand; the unique index already guards duplicates.\n- Storing history is cheap; reading it per view is the cost. Storage scope is a constant (`FIRST_W3C_SEASON`). Do not propose Python rule evaluation over the rows again.", "pitfalls/one-schema-wipes-columns": "# What happened\n\n`PUT /users/{id}` with only an `mmr` answered 500 because it also set the required `name` to null. A nullable column in the same position was erased silently. Three internal callers also handed a response object to an update and failed with `'dict' object has no attribute '_sa_instance_state'`.\n\n# The rule\n\nEvery entity has an Update shape with every field optional, applied with `model_dump(exclude_unset=True)`. An update takes an Update built from the fields it means to change, never a Public read back. See [model families](../data/model-families.md).", "pitfalls/prod-guild-is-test-guild": "# The situation\n\nA guest classification was read as a wrong guild setting, and the proposed fix was to change the setting. The setting is deliberate.\n\n# The rule\n\n`DISCORD_GUILD_ID` names the guild the membership check reads. Changing it is a maintainers' decision that also needs new role ids in the bindings. Treat \"classified as guest\" as \"is this account in the configured guild\".", "pitfalls/pytest-walkup": "# What happened\n\npytest accepts a `pyproject.toml` as its config only when the `[tool.pytest]` table is not empty. With an empty table, root discovery walked up from a worktree under the checkout, adopted the checkout's `pyproject.toml`, and applied its `pythonpath` relative to the checkout, so the checkout's `app/` silently supplied imports.\n\n# The rule\n\nKeep `[tool.pytest]` non-empty (it holds `testpaths`). When pytest behaves impossibly in a worktree, read `rootdir:` and `configfile:` in its header first. The native `[tool.pytest]` table is the modern form on pytest 9; do not rename it to `ini_options`.", "pitfalls/seed-defaults-to-prod": "# The rule\n\nAlways name the environment: `uv run just vercel seed staging`. Read a recipe's defaults before running one that writes.", "pitfalls/sqlmodel-relationship-quoting": "# What happened\n\nModernising `Optional[\"X\"]` to `\"X | None\"` made every mapper fail with `failed to locate a name`. SQLModel unwraps a real union to its non-None arm and hands a bare forward reference through as a string; a quoted union is one opaque string.\n\n# The rule\n\n`X | None` on a relationship needs `X` to be a real object at class creation. A target importable only under `TYPE_CHECKING`, because of an import cycle, keeps `Optional[\"X\"]` with a comment saying why. Three attributes in the app do. Before assuming a relationship must keep `Optional`, look for the cycle.", "pitfalls/staging-url-wrong-db": "# What happened\n\nA settings write against the raw staging URL failed with `relation \"settings\" does not exist`, and an alembic `current` read the wrong database.\n\n# The rule\n\nResolve the name the way `api/preview_db.py` does: the branch copy if it exists, else the shared database, then rewrite the URL's database part. Compare schema state on the actual app database and on `public` tables only; Supabase carries system schemas that inflate a bare table count.", "pitfalls/test-drives-the-oracle": "# What happened\n\nThe achievement boundary tests called `tests/achievement_oracle.py`. The production rule is SQL in `app/core/achievement_shapes.py`. Changing `>=` to `>` there broke who earns a badge and every test passed. The random parity test stepped over the exact thresholds.\n\n# The rule\n\nWhen a suite has an oracle, ask which side each test drives. Feed the boundary cases through both faces. The parity test now walks the same case table.", "pitfalls/transaction-pooler": "# What happened\n\nTwice. On production, 212 concurrent reads gave 83 answers of `500 {\"error\": \"Database error\"}`. On staging, one veto link failed with nobody else on the site. The log said `max clients reached in session mode - max clients are limited to pool_size: 15`. Every warm Vercel instance keeps up to five idle pooled connections, and in session mode each idle client holds one of the 15 slots per database.\n\n# The rule\n\n- `DB_URL` on every Vercel target uses the transaction pooler on port 6543. It held 60 idle clients in a test with no error.\n- `init_engine` passes `prepare_threshold=None` for Postgres, because the transaction pooler rejects server-side prepared statements.\n- Migrations and the `just` recipes may stay on 5432.\n- An environment change applies only to deployments built after it; redeploy after editing it.\n- Never fan out per-row requests from a page; a bulk route is one transaction.", "pitfalls/w3g-winner-not-parseable": "# What happened\n\nA record-by-record walk over the replay's game events was written to guess a winner from who left first. It was a hand-written parser over a format the app does not own, unverifiable on one sample and fragile on every client version. It was cut back.\n\n# The rule\n\nRead the header and the first inflated block: the map path and both battle tags. Match a map by its human name, because W3Champions renames the file per game. Never walk records without approval. In a 1v1 the loser usually leaves first; that is a warning, never a verdict.", "runbooks/backup-and-restore": "# The state\n\n- Production migrates inside the Vercel build with no dump first.\n- A row delete drops its replays and pictures after the commit, so a database restore does not bring them back.\n- `POST /export` covers about a third of the tables. It is a season snapshot and a test-data loader, not a restore path. The three import routes nothing calls stay until recovery is worked out.\n\n# Before a destructive migration\n\n1. Take a dump from a machine that holds the production URL: `pg_dump -Fc` with a client at least as new as the server. Older clients refuse.\n2. Check the file is not empty.\n3. Merge the migration.\n\nNo production credential lives in CI, by decision. The dump is a hand step.\n\n# Restore\n\n`pg_restore -d <database> <file>` on an empty database at the same migration revision, then the pictures and replays from their stores if they still exist. This path is untested.", "runbooks/deploy-vercel": "# The normal path\n\n1. Merge the pull request into `main`. Vercel builds production from that commit.\n2. The build command runs `alembic upgrade head` against the production database before the new code is promoted. A failed migration stops the deploy and the previous build keeps serving.\n3. A workflow force-pushes `staging` to the same commit, so the staging alias serves the merged code within seconds.\n4. Check what production serves by asking the API for a field the change added, not by looking for a deployment row: a rate-limited day produces no row and production stays on the previous build.\n\n# Environment\n\nThe README's variable table is the whole deploy list. Vercel adds `VERCEL_ENV` and `VERCEL_GIT_COMMIT_REF`. `DB_URL` in production and preview uses the transaction pooler on port 6543; the session pooler on 5432 holds 15 clients and a few warm functions fill it. See [the pitfall](../pitfalls/transaction-pooler.md). An environment change applies only to deployments built after it: redeploy.\n\n# Previews\n\nEvery push builds a preview against the staging Supabase project. A branch with no migration uses the shared staging database; a branch with a migration gets a copy of the locked template and migrates it. A branch that does not know the shared database's revision fails its build with \"rebase onto main\". The copy is dropped when the branch is deleted. See [preview databases](../../PREVIEW-DATABASES.md). Previews sign in on the Clerk dev instance and are public.\n\n# The recipes\n\n`uv run just vercel deploy [prod|staging]` deploys the working tree; `logs`, `status`, `migrate`, `alembic`, `seed`, `import-maps`, `review-season`, `list` and `drop` are the rest. Run them only from the linked main checkout, never from a worktree: the `.vercel/` link folder is gitignored, and a run elsewhere creates a stray project that builds every push. A CLI deploy from a commit whose author is not a Vercel team member is silently blocked; export the tree with `git archive` first. Never run the Vercel CLI outside the recipes: without the token it starts a device authorization flow.\n\n# The Hobby limits\n\n- One cron per project, once a day. A more frequent schedule fails every deployment. Jobs that need minutes run from outside; see [jobs](../api/jobs.md).\n- 100 deployment creations per rolling day across the account, and a daily build quota. A preview check that fails with the quota message is not a merge blocker.\n- Deployment storage counts GB-months over retained deployments. Retention is set in the dashboard: a day for everything but production, a week for production.\n- Function duration is 60 seconds. A season import from the API times out; import from a machine that runs the server.\n\n# The cron\n\n`vercel.json` schedules `GET /jobs/w3c-sync` at 04:00 UTC. Vercel may shift it by up to 59 minutes.", "runbooks/discord-setup": "# Steps\n\n1. In the Discord Developer Portal, create the application with a bot. Set `DISCORD_APPLICATION_ID`, `DISCORD_PUBLIC_KEY`, `DISCORD_BOT_TOKEN` and `DISCORD_GUILD_ID` on the backend. The interactions endpoint URL is the adapter's, not the backend's; see the `wc3-gym-discord-bot` repository.\n2. Register the commands on the guild: `uv run just discord-commands`. It replaces the guild's command list with `COMMANDS` from `app/services/interactions.py`. Guild commands update at once.\n3. Upload the app emojis: `uv run just discord-emojis`. `/stats` and the cards show race icons and the W3Champions crown once they exist.\n4. In the guild, place the bot's role directly above the season and team roles and below everything else, with Manage Roles. A bot manages only roles below its own; a role higher up is out of its reach on purpose.\n5. Set the `settings` rows `results_channel_id` and `content_channel_id` to the channels the cards go to. Before a write test against staging, point them at a test channel; a staging row may name a live channel.\n6. Add the Discord role bindings under Config > Discord roles. New bindings start ignored; mark one synced to let the button manage it.\n\n# Facts\n\n- The guild the backend reads is a maintainers' decision. Changing it needs new role ids in the bindings.\n- The bot's token can read a channel over REST; it cannot write forum tags without Manage Threads.\n- Test posts to a test channel use `allowed_mentions: {\"parse\": []}` so nobody is pinged.", "runbooks/run-locally": "# Steps\n\n1. Install `uv`. Run `uv sync`. That installs the right Python, the dependencies and the dev tools, including `just`.\n2. `cp .env.example .env`. The example holds development values; the deployment reads none of this file.\n3. Run the tests: `uv run just test`. They need no database server and no environment.\n4. Start the stack in Docker: `uv run just up`. It creates the network and the Postgres container once, builds the image from the working tree, runs the migrations and serves on port 5002. The API docs are at `http://localhost:5002/docs`. Log in with the admin token from your `.env`.\n5. Or run the code as Vercel runs it, without Docker: `uv run just serve`. Migrate first with `uv run just local alembic upgrade head`.\n6. Load real data: `uv run just local seed` clones the private seed repository, if you have access, and loads it. Or `uv run just local import-xlsx` imports the two real workbooks from `tests/data`.\n7. Read the log with `uv run just logs`, open psql with `uv run just psql`, stop with `uv run just down`. The data stays in the named volume.\n\n# Without Docker\n\nWSL and some laptops have no Docker. A real Postgres runs from the `pgserver` wheel on Python 3.12 (the wheels stop there): start it once, point `DB_URL` at its socket, and run `uv run just serve`. `TEST_DB_URL` runs the whole suite on it.\n\n# The two URL forms\n\n`DB_URL` names the same database twice. Inside a container on the `gnl-net` network the host is `gnl-postgres`; on the laptop it is `localhost`. The recipes pass the right form; typing the commands by hand is where this goes wrong.\n\n# Daily loop\n\nChange code, `uv run just up` again to rebuild, `uv run just fmt` before committing, `uv run just lint` and `uv run just typecheck` as CI runs them.", "runbooks/seed-and-review-season": "# Seed\n\nThe seed is a private repository of one CSV per table plus `logos/<team id>.<ext>`, made from a production dump. `uv run just local seed`, `uv run just vercel seed staging` and the azure recipe migrate the target, truncate every table, copy the CSVs with foreign keys off, set every sequence, seed the achievement catalogue, and push the logos through the upload path.\n\n**`just vercel seed` defaults to `prod`.** It truncates. Always name the environment: `uv run just vercel seed staging`. See [the pitfall](../pitfalls/seed-defaults-to-prod.md).\n\nFor staging the recipe rebuilds the locked template first and then the shared database from it, so new previews start from the fresh copy. Open branch copies are untouched.\n\n# Review season\n\n`uv run just vercel review-season staging <reviewer discord id>` builds a season on staging where the two named accounts captain opposing teams, every account in the guild plays, and the pairings rotate each round. It becomes the current season and both accounts get an admin grant. Rosters, maps and the pick-and-ban order copy from the latest real season; badges come from the catalogue; the map rules are `fixed,loser,loser`. Running it again replaces the season. `season-badges` seeds badges into a season built another way.\n\n# Which staging database\n\nThe staging connection string names the anchor database, which holds no app tables. The app serves from the shared staging database or from a branch copy. Resolve the name the way `api/preview_db.py` does before connecting by hand. See [the pitfall](../pitfalls/staging-url-wrong-db.md)."}, "types": ["API Area", "Convention", "Data Model", "Decision", "Domain Concept", "Integration", "Pitfall", "Repository", "Runbook", "Unknown"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}};
</script>

(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
