* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

ions/season-boundary-manual"}}, {"data": {"id": "concepts/vocabulary__concepts/roles-and-permissions", "source": "concepts/vocabulary", "target": "concepts/roles-and-permissions"}}, {"data": {"id": "concepts/vocabulary__concepts/koth", "source": "concepts/vocabulary", "target": "concepts/koth"}}, {"data": {"id": "concepts/vocabulary__concepts/series-reporting", "source": "concepts/vocabulary", "target": "concepts/series-reporting"}}, {"data": {"id": "concepts/w3champions__concepts/settings-and-current-season", "source": "concepts/w3champions", "target": "concepts/settings-and-current-season"}}, {"data": {"id": "conventions/code-style__pitfalls/sqlmodel-relationship-quoting", "source": "conventions/code-style", "target": "pitfalls/sqlmodel-relationship-quoting"}}, {"data": {"id": "conventions/code-style__conventions/okf-bundle", "source": "conventions/code-style", "target": "conventions/okf-bundle"}}, {"data": {"id": "conventions/code-style__concepts/vocabulary", "source": "conventions/code-style", "target": "concepts/vocabulary"}}, {"data": {"id": "conventions/git-and-pull-requests__pitfalls/column-drop-two-deploys", "source": "conventions/git-and-pull-requests", "target": "pitfalls/column-drop-two-deploys"}}, {"data": {"id": "conventions/layering__data/model-families", "source": "conventions/layering", "target": "data/model-families"}}, {"data": {"id": "conventions/layering__api/auth", "source": "conventions/layering", "target": "api/auth"}}, {"data": {"id": "conventions/layering__api/overview", "source": "conventions/layering", "target": "api/overview"}}, {"data": {"id": "conventions/layering__concepts/derived-scores", "source": "conventions/layering", "target": "concepts/derived-scores"}}, {"data": {"id": "conventions/layering__decisions/derived-not-stored", "source": "conventions/layering", "target": "decisions/derived-not-stored"}}, {"data": {"id": "conventions/testing__pitfalls/test-drives-the-oracle", "source": "conventions/testing", "target": "pitfalls/test-drives-the-oracle"}}, {"data": {"id": "data/migrations__pitfalls/column-drop-two-deploys", "source": "data/migrations", "target": "pitfalls/column-drop-two-deploys"}}, {"data": {"id": "data/migrations__pitfalls/alembic-two-heads", "source": "data/migrations", "target": "pitfalls/alembic-two-heads"}}, {"data": {"id": "data/migrations__runbooks/backup-and-restore", "source": "data/migrations", "target": "runbooks/backup-and-restore"}}, {"data": {"id": "data/model-families__pitfalls/one-schema-wipes-columns", "source": "data/model-families", "target": "pitfalls/one-schema-wipes-columns"}}, {"data": {"id": "data/model-families__pitfalls/datetimes-are-utc", "source": "data/model-families", "target": "pitfalls/datetimes-are-utc"}}, {"data": {"id": "data/model-families__concepts/pictures-and-replays", "source": "data/model-families", "target": "concepts/pictures-and-replays"}}, {"data": {"id": "data/tables__concepts/settings-and-current-season", "source": "data/tables", "target": "concepts/settings-and-current-season"}}, {"data": {"id": "data/tables__data/migrations", "source": "data/tables", "target": "data/migrations"}}, {"data": {"id": "decisions/availability-blocklist__concepts/scheduling-and-availability", "source": "decisions/availability-blocklist", "target": "concepts/scheduling-and-availability"}}, {"data": {"id": "decisions/derived-not-stored__concepts/derived-scores", "source": "decisions/derived-not-stored", "target": "concepts/derived-scores"}}, {"data": {"id": "decisions/pictures-as-urls__concepts/pictures-and-replays", "source": "decisions/pictures-as-urls", "target": "concepts/pictures-and-replays"}}, {"data": {"id": "decisions/reads-open-writes-admin__concepts/roles-and-permissions", "source": "decisions/reads-open-writes-admin", "target": "concepts/roles-and-permissions"}}, {"data": {"id": "decisions/season-boundary-manual__concepts/settings-and-current-season", "source": "decisions/season-boundary-manual", "target": "concepts/settings-and-current-season"}}, {"data": {"id": "decisions/vercel-and-supabase__api/jobs", "source": "decisions/vercel-and-supabase", "target": "api/jobs"}}, {"data": {"id": "decisions/vercel-and-supabase__pitfalls/transaction-pooler", "source": "decisions/vercel-and-supabase", "target": "pitfalls/transaction-pooler"}}, {"data": {"id": "decisions/vercel-and-supabase__pitfalls/blob-egress", "source": "decisions/vercel-and-supabase", "target": "pitfalls/blob-egress"}}, {"data": {"id": "overview__concepts/vocabulary", "source": "overview", "target": "concepts/vocabulary"}}, {"data": {"id": "overview__concepts/gnl-season", "source": "overview", "target": "concepts/gnl-season"}}, {"data": {"id": "overview__concepts/events-module", "source": "overview", "target": "concepts/events-module"}}, {"data": {"id": "overview__conventions/layering", "source": "overview", "target": "conventions/layering"}}, {"data": {"id": "overview__data/model-families", "source": "overview", "target": "data/model-families"}}, {"data": {"id": "overview__api/overview", "source": "overview", "target": "api/overview"}}, {"data": {"id": "overview__api/auth", "source": "overview", "target": "api/auth"}}, {"data": {"id": "overview__runbooks/run-locally", "source": "overview", "target": "runbooks/run-locally"}}, {"data": {"id": "overview__conventions/testing", "source": "overview", "target": "conventions/testing"}}, {"data": {"id": "overview__conventions/git-and-pull-requests", "source": "overview", "target": "conventions/git-and-pull-requests"}}, {"data": {"id": "pitfalls/column-drop-two-deploys__data/migrations", "source": "pitfalls/column-drop-two-deploys", "target": "data/migrations"}}, {"data": {"id": "pitfalls/hobby-cron-daily__api/jobs", "source": "pitfalls/hobby-cron-daily", "target": "api/jobs"}}, {"data": {"id": "pitfalls/one-schema-wipes-columns__data/model-families", "source": "pitfalls/one-schema-wipes-columns", "target": "data/model-families"}}, {"data": {"id": "runbooks/deploy-vercel__pitfalls/transaction-pooler", "source": "runbooks/deploy-vercel", "target": "pitfalls/transaction-pooler"}}, {"data": {"id": "runbooks/deploy-vercel__api/jobs", "source": "runbooks/deploy-vercel", "target": "api/jobs"}}, {"data": {"id": "runbooks/seed-and-review-season__pitfalls/seed-defaults-to-prod", "source": "runbooks/seed-and-review-season", "target": "pitfalls/seed-defaults-to-prod"}}, {"data": {"id": "runbooks/seed-and-review-season__pitfalls/staging-url-wrong-db", "source": "runbooks/seed-and-review-season", "target": "pitfalls/staging-url-wrong-db"}}], "bodies": {"api/auth": "# Two kinds of bearer\n\n1. **The admin token.** `POST /login` with `{\"token\": <ADMIN_TOKEN>}` mints a JWT signed with `JWT_SECRET_KEY` that lasts `TOKEN_TIME` minutes. Its subject is `admin`, it carries no Discord account, and `/me` names it \"Super Admin\". The admin UI's `/admin-login` page and scripts use it.\n2. **A Clerk session.** The frontend signs a member in with Clerk, Discord being the only social connection, and sends the session JWT as the bearer. `clerk-backend-api` verifies it locally against the instance's keys, with `CLERK_SECRET_KEY`; `CLERK_AUTHORIZED_PARTIES` lists the origins a session may come from.\n\n`require_login` tries the JWT first and falls back to Clerk. It admits a guest too.\n\n# From a session to claims\n\nOnce per request, `clerk_claims` resolves and caches on `request.state`:\n\n- the Discord id behind the Clerk user, from `clerk_account`, written by the first request of a login and rewritten only when Clerk names another Discord account;\n- the role: `admin` from `admin_grant` or `ADMIN_DISCORD_IDS` with no guild read; else `member` or `guest` from the guild read; a member with captain seats in a running season becomes `captain` with a `seats` list.\n\nEvery check is live, so a kick, a grant or a seat change shows on the next request. Nothing about membership is cached across requests.\n\n# The guards\n\n| Guard | Admits |\n|---|---|\n| `optional_login` | anyone; answers `None` with no bearer |\n| `require_login` | any valid session, guest included |\n| `require_member` | a guild member or higher |\n| `require_captain` | a captain of a running season, or an admin |\n| `require_admin` | an admin, or the admin token |\n\nRoutes use them as `Annotated` types (`RequireAdmin`, `RequireMember`) or as `dependencies=[Depends(require_admin)]`. See [roles](../concepts/roles-and-permissions.md) for the ownership checks that sit beside them.\n\n# /me\n\n`GET /me` answers the account: `discord_id`, `name`, `avatar`, `role`, `actual_role`, `user` (the linked players row or null), `superadmin`, `signed_up`, `season_id`, `team`, `seats`, and `seasons` (every season that is not complete, newest first, each with its phase, switches, dates, and this account's roster and captain facts). The frontend keeps this answer for the session and reads its role from it. It also refreshes the profile avatar from Discord.\n\n# View as\n\nAn admin's `X-View-As` and `X-View-Seats` headers lower the role for one request. See [roles](../concepts/roles-and-permissions.md).\n\n# Clerk in production\n\nProduction runs the Clerk production instance in proxy mode: the frontend serves `/__clerk/*` through an edge function, because Clerk cannot own a `vercel.app` subdomain. Previews and local development use the dev instance. Never point a preview at the production backend: its session is signed by the other instance and every `/me` answers 401. The frontend repository owns the proxy; this repository only verifies the token.", "api/consumers": "# The consumers\n\n| Consumer | Repository | Reads | Auth |\n|---|---|---|---|\n| the web app | `wc3-gym-frontend` | most routes | Clerk session or the admin token |\n| the WordPress site | `gym_website_scripts` | eight routes on every page view, no cache: `GET /stats/career`, `GET /config/settings`, `GET /teams/season/{id}`, `GET /teams/{id}/image`, `GET /seasons/{id}`, `POST /matches/search`, `POST /series/season/{id}/playday/{n}/search`, `POST /fantasy/teams/search` | none |\n| the Discord adapter | `wc3-gym-discord-bot` | `POST /discord/interactions` | Discord's signature |\n| the cast-reminder worker | `wc3-gym-discord-bot`, `cron/` | `GET /jobs/cast-reminders` every five minutes | `CRON_SECRET` bearer |\n| Vercel cron | this repository's `vercel.json` | `GET /jobs/w3c-sync` once a day | `CRON_SECRET` bearer |\n| Nightbot | no repository | `GET /koth/signup`, the old `/koth/*` reads | the Nightbot token |\n| the stream overlay and bookmarks | none | the old `/koth/*` reads | none |\n\nThe WordPress shortcodes today call the older backend on the Azure box, not this deployment. When they move, the eight routes above are the contract.\n\n# What pins the shapes\n\n- `tests/test_public_contract.py`: presence and shape of the fields the PHP reads, route by route.\n- `tests/test_contract.py`: the fields the offline leaderboard reads.\n- `tests/test_gnl_snapshot.py`: the GNL season, dashboard and card payloads byte for byte against `tests/data/gnl_snapshot.json`. Set `UPDATE_GNL_SNAPSHOT=1` to rewrite it, and read the diff: a change to it is a change to a public contract.\n- `tests/test_error_envelope.py`: the `error` key every client reads.\n- `tests/test_paging.py`: the paged routes, their default order and sort names.\n\nA change that fails one of these is a cross-repository change. Ship the consumer's change, or keep the old field beside the new one for a deploy.\n\n# Rules a consumer can rely on\n\n- Every error is `{\"error\": ...}`.\n- A field is added, never renamed in place. `week_map_id` on the veto board and `playday` on fixtures are examples of names kept for consumers.\n- The GNL season payloads keep `season_id`, `phase` and `playday` although the table is `event`.\n- List routes page with `limit` and `offset` and answer `X-Total-Count`.\n- Reads are open. Writes need an admin, or the owning member for self-service routes.", "api/jobs": "# The routes\n\n| Route | Does | Called by |\n|---|---|---|\n| `GET /jobs/w3c-sync` | drains the stalest players' ladder matches and stats for 50 seconds, inside the 60 second function limit | Vercel cron at 04:00 UTC, shifted by up to 59 minutes |\n| `GET /jobs/cast-reminders` | posts the reminder card for series that start soon | the Cloudflare Worker in the Discord adapter repository, every five minutes |\n\nBoth check `Authorization: Bearer <CRON_SECRET>`. With `CRON_SECRET` unset every job route answers 503, so a deployment without the secret runs no job.\n\n# Why the worker exists\n\nThe Vercel Hobby plan runs a cron once a day, and a `vercel.json` schedule that runs more often fails the whole deployment with no build log. A job that needs to run every few minutes gets a `/jobs/<name>` route here and something outside the backend calls it. The maintainers chose a Cloudflare Worker for the reminder; a GitHub Actions schedule was the other option, with the caveat that GitHub delays scheduled runs under load and switches a schedule off after 60 days without a push. See [the pitfall](../pitfalls/hobby-cron-daily.md).\n\n# Adding a job\n\n1. Add a route under `/jobs` that takes `credentials: Credentials` and calls `only_the_scheduler`.\n2. Keep the work under the function limit; drain a bounded slice per call and let the next call continue, the way the sync does.\n3. Schedule it outside, or daily in `vercel.json` if daily is enough.", "api/overview": "# Route modules\n\n| Module | Prefix | Area |\n|---|---|---|\n| `login.py` | `/login`, `/me` | the admin token login and the session answer |\n| `users.py` | `/users` | players, bans, blocks, W3Champions sync, history |\n| `teams.py` | `/teams` | teams, rosters, captains, availability grid, logos |\n| `seasons.py` | `/seasons`, `/achievements` | seasons, maps, rounds, signups, ladder reads, badges |\n| `leagues.py` | `/leagues` | leagues |\n| `events.py` | `/events`, `/me/events` | events, entrants, divisions, stages, standings |\n| `matches.py` | `/matches` | fixtures |\n| `series.py` | `/series`, `/casts` | series, result kind, places, sides, casts |\n| `draft_series.py` | `/draft-series` | a captain's proposed series |\n| `public.py` | `/signup`, `/player-series`, `/player-availability`, `/player-blocks`, `/player-history`, `/user-info`, `/fantasy-team`, `/fantasy-bet` | a member's own flows |\n| `maps.py` | `/maps` | maps and the ladder import |\n| `fantasy.py` | `/fantasy` | admin fantasy management and the breakdown |\n| `koth.py`, `koth_nights.py` | `/koth` | nights and the old KOTH payloads |\n| `config.py` | `/config` | settings, admins, role bindings, role sync |\n| `stats.py` | `/stats/career` | career stats |\n| `import_export.py` | `/import`, `/export`, `/fantasy/import` | workbooks |\n| `jobs.py` | `/jobs` | the scheduled jobs |\n| `discord.py` | `/discord/interactions` | the forwarded Discord interactions |\n| `health.py` | `/health` | liveness |\n\nSwagger UI is at `/docs` and the OpenAPI document at `/openapi.json`. FastAPI includes routers lazily, so enumerate routes from `app.openapi()[\"paths\"]`, not from `app.routes`.\n\n# The error envelope\n\nEvery error answers `{\"error\": \"<text>\"}` with the status: 404 `NotFoundError`, 400 `BadRequestError`, 502 `ExternalServiceError`, 409 integrity conflicts (\"Row already exists\" or \"Row is still referenced\"), 422 validation with the field names in the text, 500 with the fixed text \"Internal Server Error\" and the detail in the log. The router's own 404 and 405 carry the envelope too. A few public routes add a second key, `message`, with human text beside an `error` code. `tests/test_error_envelope.py` locks it. FastAPI's stock `{\"detail\": ...}` never reaches a client.\n\n# Paging and sorting\n\nList routes take `limit` (1 to 500, default 500) and `offset`. Seven routes carry the total row count in `X-Total-Count`, which CORS exposes. Three routes take `sort` and `order`; a name outside their table answers 422. Without `sort` a route keeps its default order, pinned per route by `tests/test_paging.py`. List answers are reduced: every key stays and nested collections answer `[]`; the single-row routes keep the full graph.\n\n# The search language\n\n`POST /<area>/search` takes a `query` such as `season_id == 3 and name ilike smith`, parsed by `app/core/query.py`. Use a service's `find_by_*` method for a value the caller supplies; keep the language for a query a client wrote.\n\n# CORS and caching\n\nCORS allows every origin, because clients send bearer tokens and never cookies. A route that sets `Cache-Control: public` must write `Access-Control-Allow-Origin: *` itself, next to it. See [the pitfall](../pitfalls/edge-cache-cors.md).", "concepts/derived-scores": "# The rule\n\nA series stores only the maps each side won. Everything else is computed when it is read:\n\n- **Series points.** A lost series keeps its map score. A won series pays the top of the scale minus the loser's maps. The scale comes from the season's `score_system` and the maps a win takes: `standard` tops at 2*wins-1, `helpstone` at 2*wins. A Bo3 tops at 3 or 4.\n- **Fixture score.** The sum of the series points per side.\n- **Standings.** The sum over a team's fixtures. A team with no played series reads (0, 0, full points available); there is no null state.\n- **Career rating.** A season pays a player one point per series won, half a point per other series played, and one point for playing at all. Every league season first takes 15% off the rating a player carries. The fold runs over the seasons in order, so it depends on the whole league.\n- **Fantasy scores.** See [fantasy](fantasy.md).\n- **Per-player season record.** Games, wins and losses per season, from the series.\n\n# Why helpstone exists\n\nUnder the old 3/2/1/0 scale a 2:1 was undervalued and a 1:2 overvalued, so three Bo3 wins could tie one. Helpstone pays 4 per Bo3: both sides start at 2, each map is +1 to the winner and -1 to the loser.\n\n# Two faces, one rule\n\nEach rule has a Python face for loaded rows and a SQL `CASE` face for aggregates, both in `app/core/`. A test pins the two to each other over every combination. `app/services/derived.py` fills a response in two statements: one resolves the scale of every series or season in it, one sums the series on that scale. Seasons that share a scale share a statement. `tests/test_query_budget.py` fails when a serialization adds a lazy load.\n\n# What must never come back\n\nNo stored `points`, `team_score`, `final_score`, `rating` or fantasy total column. No recalculate route or button. Stored rollups caused a wipe bug, write races, a recalculation button people forgot to press, and import staleness. A new derived value goes in `derived.py` with a constant-statement fill and a budget test, with its pure rule in `app/core/`. See [the decision](../decisions/derived-not-stored.md).\n\n# Ladder and achievements\n\nThe W3Champions ladder points and the 24 achievement badges follow the same pattern: matches are stored, points and badges derive. See [ladder and achievements](ladder-and-achievements.md).", "concepts/discord-integration": "# The contract with the adapter\n\nDiscord sends every slash command, button press and autocomplete to a small adapter in the repository `wc3-gym-discord-bot`. The adapter checks Discord's Ed25519 signature, answers inside Discord's 3 second window with a deferred private reply, and forwards the payload unchanged to `POST /discord/interactions` with the same two headers, `X-Signature-Ed25519` and `X-Signature-Timestamp`. This route checks the signature again with `DISCORD_PUBLIC_KEY`, so it trusts Discord and nothing else, then runs the command and replies through the interaction token: a private edit of the deferred reply, or a public follow-up in the channel. The route answers 503 while `DISCORD_PUBLIC_KEY` is unset. Autocomplete has no deferred form; the adapter waits 2 seconds and answers an empty list on a timeout.\n\nThe adapter holds no bot token and knows no command. The command list lives here, in `COMMANDS` in `app/services/interactions.py`, and `uv run just discord-commands` registers it on the guild.\n\n# The commands\n\n| Command | What it does |\n|---|---|\n| `/upcoming` | the series scheduled in the next days, claimed first |\n| `/leaderboard` | achievement, ladder or fantasy points this season |\n| `/achievements` | a player's badges |\n| `/stats` | one player's GNL season from the stored ladder and their series |\n| `/announce` | the match card of one series, posted in the channel |\n| `/availability` | a card for one round with one button per answer |\n| `/schedule` | set the time of the caller's series |\n| `/score` | report a result with one replay per game, through the same write the dashboard uses |\n| `/veto` | point the two players at the veto board and say where it stands |\n| `/postlinks` | the site's links as buttons, posted by an admin |\n\nEach command is one module under `app/services/commands/`. A module imports `base.py`, never `interactions.py`, which imports the modules.\n\n# Cards and posts\n\nThe app posts a result card, a cast claim card and a start reminder, plus one card per event with sign-up and withdraw buttons. Each post is a `discord_post` row so the app can edit it later. The channels come from the `settings` rows `results_channel_id` and `content_channel_id`; a missing row means no card.\n\nDiscord allows five edits per five seconds per channel. `discord_posts.refresh_series` claims an edit with one UPDATE, waits when the channel had an edit in the last second, and skips a post already edited after its latest change, so a burst collapses to the last state. `discord._channel_call` waits out one 429. Never loop edits per write, and never use an in-memory queue or lock: no process survives a request on Vercel. See [the decision](../decisions/discord-rate-limit.md).\n\nCard rules: a mention is a call to action, so `/upcoming` tags nobody and the reminder tags the casters and the players; no database ids on a card; the round number, not the week; a player reads `{flag} {name} ({race} {mmr})` with the race played, else the signup race; every time is a Discord timestamp; the veto shows what the season's `map_rules` say.\n\n# The guild read and the roles\n\nAn account's Discord token from Clerk only identifies it; the bot token reads the guild membership. `DISCORD_GUILD_ID` names the guild. Which guild it names is a maintainers' decision, never a configuration fix for a guest classification.\n\n`discord_role_binding` maps a role kind and scope to a guild role. `POST /config/discord-roles/sync` grants and revokes season roles; it never touches admin or coach roles, and it runs only when an admin presses the button. The bot's role must sit directly above the season roles in the guild's role list and below everything else, because a bot manages only roles below its own. See [roles](roles-and-permissions.md).\n\n# Reading a Discord link\n\nA session cannot open a `discord.com/channels/...` link, but the REST API with the bot token reads a channel or thread: `GET /channels/{id}/messages?limit=50`. The bot token is an environment value.", "concepts/events-module": "# One model\n\nEvery event kind shares the rows: `league`, `event`, `event_stage`, `event_round`, `event_division`, `event_entrant`, `matches` (fixtures), `series`, `series_side`, `series_game`. A GNL season is the `gnl` kind of event; it runs on the same tables and its payloads did not change when the tables were renamed. `tests/test_gnl_snapshot.py` pins those payloads, so a migration that shifts a GNL field fails before it reaches a page.\n\nThe rule that keeps this workable: **the shared engine never branches on kind.** A kind that needs different behaviour gets a kind module (`app/services/koth/`, and the GNL draft and fantasy services) and, where it needs its own columns, a side table. Never write `if kind == \"gnl\"` inside a shared service. See [the decision](../decisions/unified-event-model.md).\n\n# Stages\n\n`EventStage` names the format, the best-of, the map rules, the scheduling mode, the ranking rule and the advance count. Formats: `round_robin`, `gnl`, `single_elimination`, `double_elimination`, `swiss`, `koth`, `ffa`. A stage may split into groups that merge at the next stage; a division never merges.\n\nThe stage engine (`app/services/stage_engine.py`) generates the series of a stage, follows results through the feeder graph, and ranks the entrants. A `gnl` stage is drafted by its admin and its captains, so the engine refuses to generate one. A Swiss stage draws one round at a time. An `ffa` stage plays lobbies whose result is an order of places. A `koth` stage is a chain per division.\n\n`app/services/series_rules.py` answers the rules one series plays under: a generated series reads them from its round, its stage and its event; a GNL series reads them from its season. The shape of the row decides, never the kind.\n\n# Entrants, seeds, divisions\n\nAn entrant is a player or a pre-made team in one event, with a race, a seed, a division, and eligibility warnings (`min_games`, `mmr_max`, a ban). Warnings show on the row and never refuse a signup. Seeds come from MMR, a shuffle, a hand order, the previous stage, a qualifier or an invitation. An admin locks the seeds of a stage; a locked stage refuses a seed write.\n\nDivisions cut the entrant pool by MMR (`app/core/divisions.py`). Every division runs the same stage list on its own; a merged playoff across divisions is never a rule in the app.\n\n# Signup policy\n\n`signup_policy` is `members` (a member with an account) or `anyone` (any battle tag; KOTH takes signups from Twitch chat this way). A per-event switch allows one entrant row per race, off by default, on for KOTH nights.\n\n# Awards\n\nClosing an event freezes the table of its last stage into `event_award`, one row per placed entrant per division. A trophy read lists a cup win or a KOTH crown from those rows without replaying the stage.\n\n# Discord card\n\nEvery event has one card the app posts and edits in Discord, with a sign-up and a withdraw button. A press writes through the same entrant service the site uses. See [Discord integration](discord-integration.md).", "concepts/fantasy": "# Shape\n\nA fantasy team belongs to one member, the Fantasy Captain, and one season. It drafts players, one real team, one race, and, when the season offers it, a grind pick (a second team paid by achievement rank). The captain places bets: a stake of points on one series and a call. A member creates a team while the season is `open`; creation locks when it commences.\n\nPlayers are grouped into fantasy tiers by MMR. The season stores the ascending MMR cuts in `fantasy_tier_cuts`; a signup may pin a tier by hand (`fantasy_tier_pinned`).\n\n# Scoring, all derived at read time\n\n| Part | Pays |\n|---|---|\n| drafted players | the points of every series they played that season, plus 5 bench points for a week with no series |\n| drafted team | its standing in the season |\n| drafted race | the weekly race table: wins over losses; the three best ratios of a week take 18, 12, 6; ties share a rank |\n| bets | the stake, added when the call was right and subtracted when it was wrong |\n| grind pick | with N teams the rank r pays N - r + 1 |\n| total | the sum |\n\n`app/core/fantasy.py` holds the rule and reads no database. `app/services/derived.py` fills the list answer in a constant number of statements; `fantasy_scores.py` builds the same numbers for one team with the breakdown the page shows. A bet result costs no statement, because the series scores already ride in the response. No column stores a fantasy total, and there is no recalculate route. See [derived scores](derived-scores.md).\n\n# Routes\n\nAdmin routes under `/fantasy/...` manage teams, bets and tiers. Member routes `POST /fantasy-team`, `POST /fantasy-bet`, `PUT /fantasy-bet/{id}`, `DELETE /fantasy-bet/{id}` are ownership-checked. `GET /fantasy/teams/{id}/season/{id}/breakdown` answers the per-part breakdown. The leaderboard is read by the site and the Discord `/leaderboard` command. Workbooks import fantasy teams and bets in one transaction each.\n\n# Words\n\nThe person is a \"Fantasy Captain\" in every user-facing string. The API field stays `captain_id` with the value `captain`. A Fantasy Captain is not a GNL team captain and holds no seat. See [roles](roles-and-permissions.md).", "concepts/gnl-season": "# Shape\n\nA GNL season is one event of the GNL league with one stage of format `gnl`. Six teams are drafted from the signups by the admins and the captains. The season runs about five rounds, one per week; each round has a date window and, when the map rules ask for it, a fixed map for game 1. Each team pairing in a round is a fixture (`matches`), and inside it the two captains draft about `series_per_round` player-versus-player series. The winner is the team with the most points over every fixture. There are no playoffs.\n\n# Fields on the season that drive behaviour\n\n| Field | Meaning |\n|---|---|\n| `series_per_round` | how many series each player plays per round |\n| `score_system` | `standard` or `helpstone`; the scale series points are paid on. See [derived scores](derived-scores.md). |\n| `map_rules` | one rule per game: `fixed`, `loser`, `host`, `veto`. Null means the GNL default `fixed,loser,loser`. See [series reporting](series-reporting.md). |\n| `pick_ban` | the veto order, side A and side B per step |\n| `signups_open` | off: a signup is a request an admin may grant |\n| `scheduling_enabled` | off: the season takes no availability answers |\n| `checkin_enabled`, `checkin_days` | whether and when the round check-in opens |\n| `fantasy_grind` | whether the fantasy game offers the grind pick |\n| `fantasy_tier_cuts`, `fantasy_tiers_applied_at` | the MMR cuts between fantasy tiers |\n| `published` | off: a draft only an admin sees |\n\nThe number of rounds is not stored; the round rows are the count.\n\n# Phase\n\nA season's phase is derived on every read from its series and never stored: `open` while no series has started, `commenced` once one is scored or past its time, `overdue` when the end date passed with a result missing, `complete` when every series has a result. Every gate reads `phase`; nothing adds a date rule beside it. A `complete` season takes no signup. A `commenced` season takes a signup as a request an admin may grant.\n\nThe events module answers a second phase word for every event kind (`draft`, `signups_open`, `checkin`, `seeded`, `running`, `finished`) from `app/services/events.py`. A GNL season keeps its own four words on the season payloads.\n\n# Best of\n\nEvery GNL series is a Bo3. The backend supports any best-of through `map_rules` and the stage's `best_of`, but no GNL screen offers a choice. See [the decision](../decisions/bo3-only.md).\n\n# The current season\n\nThe `settings` row `current_gnl_season` names the season the captain check, the role sync, the public signup form and the Discord bot read. When the row is missing, the newest season wins. See [settings](settings-and-current-season.md).\n\n# Signups and the draft\n\nA member signs up through `POST /signup` with a race and an MMR. The signup row carries `draft_position` (a hand-set place; null means sort by MMR), `draft_excluded`, `fantasy_tier` and `fantasy_tier_pinned`. A hand correction to the draft order is a position, never an adjusted MMR. See [the decision](../decisions/draft-order-rerank.md).\n\n# Import and export\n\n`POST /import` reads one season from an exported workbook (ten sheets) and writes it in one transaction; `POST /export` writes it back. The import matches rows by natural keys (season name, battle tag, team name, series by fixture and players), so ids are never sent. `tests/data/` holds two season workbooks for the round-trip test.", "concepts/koth": "# Shape\n\nA night is an event of the KOTH league: one stage of format `koth`, best of one, and three divisions that are the brackets, opened at three MMR bounds. The night that takes signups is the newest published KOTH event whose signups stand open. Nothing stores \"tonight\" or \"finished\". Closing a night deletes the series nobody played, so every series left carries a result.\n\nNothing stores a crown either. The king of a bracket is the winner of the last scored series of its chain. Opening a new night carries last night's king first in the seed order; the rest follow on MMR.\n\n# Signups\n\nThree ways in, all through the shared entrant write under the `anyone` policy:\n\n- the web page, `POST /events/{id}/entrants`;\n- an admin, `POST /events/{id}/entrants/admin`;\n- Twitch chat through Nightbot, `GET /koth/signup`, authenticated with a shared token held in settings, because Nightbot cannot send a body.\n\nA player may enter on more than one race. Each race is its own entrant row with its own MMR and its own bracket; the unique key is (event, user, race). The page lists the player once with the races under him. The chain draw never pairs a player with himself. See [the decision](../decisions/koth-multi-entry.md).\n\n# The old payloads\n\nNightbot, the stream overlay and the run crew's bookmarks still call `/koth/events`, `/koth/events/active`, `/koth/signups`, `/koth/matches` and `/koth/events/{id}/kings`. `app/services/koth/legacy.py` answers those shapes from the event rows: a signup is an entrant, a match is a series of the chain, a bracket is a division, the king is derived. The four old `koth_*` tables are gone; `app/models/koth_legacy.py` holds only the shapes.\n\nThe night routes are `POST /koth/nights` (open, with the start time and the three bounds), `POST /koth/nights/{id}/close`, and the event routes for everything else.", "concepts/ladder-and-achievements": "# What is stored\n\n`w3c_ladder_matches` holds one row per GNL player per ranked 1v1 match, unique on (match id, user). Both the selected race and the rolled race are stored per side, because W3Champions filters on the selected race and Random counts everything. History starts at W3Champions season 23, where GNL S17 began.\n\n`ladder_sync` is the ledger: one row per (player, W3Champions season) with `synced_at` and `complete`. A closed season marked complete is never fetched again; the open season is re-read from its stamp. The season and team \"last synced\" stamps derive as the earliest stamp across the roster and are never stored on the season.\n\nTwo sync pipelines exist and must not be confused: **matches** (this table, this ledger, the Sync Ladder button, `POST /seasons/{id}/ladder-sync` in chunks) and **MMR and stats** (`w3cstats`, `users.w3c_synced_at`, the older Sync W3C buttons, `POST /users/{id}/w3c-sync`). Different endpoints, different stamps.\n\n# What is derived\n\n- A match pays 3 points for a win and 1 for a loss. A match of `MIN_DURATION_S` or less pays nothing and is not a game. The rule has a Python and a SQL face in `app/core/ladder.py`.\n- A player scores only on the race they signed the season up on; other races are stored and pay nothing; Random counts every race. The filter belongs in the read, never in the fetch.\n- The season window is the GNL `start_date..end_date` on that race. MMR carries across a W3Champions season boundary unchanged, so the read needs no season logic.\n- `GET /seasons/{id}/ladder` and `GET /users/{id}/ladder` answer the totals, per-day bars, MMR spans and badges. The season read is edge-cached; see [the pitfall](../pitfalls/edge-cache-cors.md).\n\n# Achievements\n\nThe 24 rules follow the community achievement definitions, and `tests/test_achievement_parity.py` pins their totals against a recorded season. A rule is code in `app/core/achievements.py`; its condition runs as one select in `app/core/achievement_rules.py`, and one union answers every player at once. Three rules pay a variable amount. Two bucket by day. The rules are not what their names suggest; do not \"fix\" them against the name.\n\nAn achievement instance is a row of `ladder_achievements(season_id, rule_id, points)`: a price, nothing else. A season drops a rule by having no row. `SeasonService.add` seeds a new season with the default set. `season_id` null means lifetime, counted only from W3Champions season 26 onwards. Team badges are in `app/core/team_achievements.py`.\n\n`tests/achievement_oracle.py` is the same rule set in Python. `tests/test_achievement_parity.py` runs both over random matches and over the same boundary case table. See [the pitfall](../pitfalls/test-drives-the-oracle.md).\n\n# The W3Champions season pin\n\nThe `settings` row `current_w3c_season` pins the season the MMR columns read. The derived default (the newest season from the API) is wrong on the day a season opens, when every player reads as zero games. The pin is a deliberate hand edit a few times a year. Never auto-follow the latest season and never clear the row. See [settings](settings-and-current-season.md).\n\n# Synchronisation\n\n`GET /jobs/w3c-sync`, called by the daily Vercel cron with `CRON_SECRET`, drains the stalest players first for 50 seconds. The manual buttons stay and have no throttle. Every W3Champions call has a 10 second timeout and a throttled answer maps to a 502 with a fixed message.", "concepts/pictures-and-replays": "# Pictures\n\n`teams.icon_url` and `maps.image` hold public URLs into the Vercel Blob store connected to the project (`BLOB_READ_WRITE_TOKEN`). A caller that reads the URL off the answer fetches the picture from the store; `GET /teams/{id}/image` still redirects, uncacheable, for the old consumers. `POST /teams/{id}/image` and `POST /maps/{id}/image` upload: magic bytes checked, 2 MB cap, a new random suffix per upload so the year-long cache never serves a stale logo, and the blob it replaced deleted after the commit.\n\nA map's `image` may also hold the URL warcraft3.info publishes, written by the ladder map import; `blob.ours` tells the two apart, so a replacement deletes only a blob the app wrote. An upload wins over an import.\n\nThe store follows the rows: a deleted team or map drops its picture after the commit. The listeners are registered on the session in `app/core/db.py`.\n\nThe SDK is imported inside each call, because it carries its own HTTP stack and only the upload path needs it.\n\n# Why not in the database\n\n`Team.icon` used to be a bytes column, so every `select(Team)` read the logo: one season page read 29.7 MB of the database to answer 139 KB, and database egress is the metered cost. `tests/test_blob_budget.py` fails on any mapped binary column. A picture is a URL. See [the pitfall](../pitfalls/blob-egress.md) and [the decision](../decisions/pictures-as-urls.md).\n\n# Replays\n\nReplays live in one Cloudflare R2 bucket per environment, named by `CLOUDFLARE_R2_BUCKET`, each with its own scoped API token (`CLOUDFLARE_ACCOUNT_ID`, `CLOUDFLARE_R2_BUCKET`, `CLOUDFLARE_ACCESS_KEY_ID`, `CLOUDFLARE_SECRET_ACCESS_KEY`). Every call is a presigned URL signed with the standard library, so the browser uploads straight to the bucket and no file crosses a Vercel function's 4.5 MB request cap. A download link lives as long as R2 allows; an old tab gets a 403 and refreshes. A key starts with `VERCEL_ENV`, so two builds never share a file. A deleted series drops its files after the commit.\n\nA `.w3g` file gives up the map and both battle tags from its first inflated block. It does not give up the winner; do not build a parser that walks its records to guess one.\n\n# Seeding\n\nA seeded database gets its logos from the private seed repository, pushed through the same upload path by `just _load-seed`, so the database owns its blobs and a replaced production logo cannot break it. Without the token the load stops after the CSVs and teams show the default logo.", "concepts/roles-and-permissions": "# The four roles\n\n| Role | Who | How it is decided |\n|---|---|---|\n| guest | a Discord account that is not in the WC3 Gym guild | the bot reads the guild; no `DISCORD_BOT_TOKEN` means everyone is a guest |\n| member | an account in the guild | the guild read |\n| captain | a member with a seat in `team_season_captain` for a running season | the database, live on every request |\n| admin | a row of `admin_grant`, or an id in `ADMIN_DISCORD_IDS` | the database; the environment ids are the bootstrap and cannot be revoked |\n\nDiscord grants nothing: the guild owner, a role with the administrator bit and the old `admin_role` setting all read as members. `admin_role` stays a setting only because the old bot reads it. The super admin is the `ADMIN_TOKEN` login, a session with no Discord account, used by the admin UI's `/admin-login` page. See [authentication](../api/auth.md).\n\n# Roles and ownership are two gates\n\nA role is coarse and global. Ownership is checked per row: my profile, my availability, my soft blocks, my series (a player on one side), my fantasy team (the Fantasy Captain), my team's seat this season (a captain). Captain and Fantasy Captain are not roles you borrow; a route checks the seat or the owning row. Name a dependency for what it checks (ownership), not for who usually passes it.\n\nBefore writing a permission, write the user story (\"As a member who owns a fantasy team, I place bets for my own team\") and derive the check from it.\n\n# Reads open, writes admin\n\nEvery GET serves any session, including a guest, unless it answers something personal. POST, PUT and DELETE keep `require_admin`, except a player's own self-service flows (signup, scheduling, reporting, veto, availability, fantasy), which are member-accessible and ownership-checked in the service. The frontend hides the buttons of admin writes rather than letting them fail: its fetch wrapper logs the session out on a 401. See [the decision](../decisions/reads-open-writes-admin.md).\n\n# View as\n\nAn admin sends `X-View-As: captain|member|guest` to be treated as that role for the request, and `X-View-Seats: team:season,team:season` to name the seats of a viewed captain. The rewrite happens where every guard reads the role, so an admin viewing as a member meets the same 403s. `/me` answers `actual_role` so the switch stays visible.\n\n# Discord roles are a mirror\n\nThe database is the source. A binding in `discord_role_binding` names a Discord role and a kind (`admin`, `captain`, `team`, `fantasy`, `gnl_participant`, `champion`) with a scope (`current`, `season`, `all`). A manual sync grants what is missing and takes back only bound roles the account no longer earns. Admin and coach roles are hand-managed in the guild and excluded from the sync. Sync is a button, never automatic. See [Discord integration](discord-integration.md) and [the decision](../decisions/app-managed-roles.md).", "concepts/scheduling-and-availability": "# The unit is the round\n\nThe question \"can you play?\" belongs to a round, never to \"every week\". A round has a date window. Once a player has a series in a round the question is moot, and the series replaces the question on the dashboard. An answer is one row per player per round (`round_availability`); no row is no answer, and clearing an answer deletes the row. The player and their captain write the same row, and the last write wins. `PUT /player-availability` and `PUT /teams/{id}/seasons/{id}/availability` are the two writers, and the Discord `/availability` card is a third door to the same service.\n\n# Ask when someone cannot play\n\nThe league ran the obvious design, a weekly poll of best times, for many seasons and dropped it: a statement of when someone cannot play is a fact, and a statement of when they are free is not. So the app asks for blocks, and blank means fully open.\n\nWhat follows, each learned the hard way:\n\n- No \"preferred\" state anywhere.\n- No inference from ladder activity; absence of a game says nothing.\n- One primitive: a time range. A standing weekly block (`user_block`) and a one-off busy date (`user_busy`) are both ranges. No categories such as work or sleep.\n- A block stores local wall-clock time and an IANA zone, never a UTC mask, so daylight saving does not shift it. `app/core/free_time.py` resolves a local time the way RFC 5545 does.\n- Half-hour resolution for the mask; the picker steps by the hour.\n- Blocks inform, never constrain. A block never writes a round answer, never reorders a pairing and never refuses a proposed time. When a player's blocks cover a whole round window, the page shows one hint with one button to confirm.\n\n# Free time of a series\n\n`GET /player-series/{id}/free-time` answers the intervals both players of a series have open inside its round, from their blocks. Series times are stored in UTC, aware. See [the pitfall](../pitfalls/datetimes-are-utc.md).\n\n# Check-in\n\nA season may open a check-in a number of days before each round. `app/core/availability.py` computes what the check-in shows for one player and one round from their answer and their blocks; it writes nothing.", "concepts/series-reporting": "# Who reports\n\nA player on either side of a series, or an admin, writes the result through `PUT /player-series/{id}`; the Discord `/score` command goes through the same write. The two series scores stay the total; `series_game` rows say how the total was reached, one per game with the side that won and the map. A third of GNL series go to a deciding game, so the per-game winner cannot be derived from the score and is stored.\n\nA series that was not played takes `result_kind` `walkover` or `forfeit` with a winner, through `PUT /series/{id}/result-kind`, admin only.\n\n# Maps\n\nThe season's `map_rules` names one rule per game: `fixed` takes the round's map (`event_round.map_id`), `loser` takes the map the loser of the game before picked, `host` and `veto` leave the game to the report. The GNL default when `map_rules` is null is `fixed,loser,loser`. What a game was played on is what the report stored; the rule only says what to offer when nothing is stored yet. The board answer still carries a field named `week_map_id`; renaming it needs both repositories to deploy in step, so it stays.\n\n# The veto board\n\nThe board is derived: the season's `pick_ban` names the order and the side of every step, the season's pool names the maps, and a `fixed` rule takes its map off the board because it is already game 1. Only the steps taken are stored (`series_veto_step`, with `entered_by`). A veto done elsewhere is entered after the fact on the same board. The board is the one place a veto exists; there is no launcher, no ad-hoc lobby, and the Discord `/veto` command only points at the board.\n\nThe veto is not a required input. The report warns, strongly, when a result comes without one; it never blocks. See [the decision](../decisions/veto-warns-never-blocks.md).\n\n# Off race\n\nA player who played another race than their signup race in one series records it on that series: `player1_off_race` / `player2_off_race`, nullable, null meaning the signup race. The resolved race, `player1_race` / `player2_race` on the response, is filled at read time and is on no write model. The two names are deliberate: an admin edit and the Discord command re-send the whole object, and one shared name would pin the resolved race into the column. Store null when the submitted race equals the signup race. See [the decision](../decisions/off-race-per-series.md).\n\n# Replays\n\nReplays live in a Cloudflare R2 bucket, one file per game. The browser uploads straight to the bucket on a presigned URL from `POST /player-series/{id}/replays/{game}/upload-url`, so no file passes through a Vercel function. A slot row is written only once the file is there, starts like a replay and is under the size cap. Keys start with the deployment environment, so two builds never share a file. A deleted series drops its files after the commit. The S18 replays from before the app are not recovered, by decision.\n\n# Casts\n\nAny member claims a series once (`POST /series/{id}/casts`); the owner or an admin changes the channel or removes it, and sets the VOD. A series with a result is over and takes no claim. The claim posts a card in Discord, and a reminder card goes out shortly before the start through `GET /jobs/cast-reminders`. See [Discord integration](discord-integration.md).", "concepts/settings-and-current-season": "# The rows\n\n| Key | Read by | When missing |\n|---|---|---|\n| `current_gnl_season` | the captain check, the role sync, the public signup form, the player history, the Discord bot | the newest season |\n| `current_w3c_season` | the MMR columns and the ladder sync | the newest W3Champions season from the API |\n| `w3c_url` | the W3Champions client; wins over the `W3C_URL` variable | the variable, then the default |\n| `KOTH_NIGHTBOT_TOKEN` | the Twitch chat signup | the signup answers 401 |\n| `results_channel_id` | the result card | no card |\n| `content_channel_id` | the cast claim and reminder cards | no card |\n| `admin_role` | the old bot only; it grants nothing here | nothing |\n| `fantasy_team_creation_enabled` | a hand override of the fantasy creation lock | the phase rule alone |\n\nBefore adding a key for the bot, read `GET /config/settings` and reuse a row with the same purpose; the old bot left rows such as `scheduling_channel_id` behind, and a staging row may name a live channel, so point a test write at a test channel first.\n\n# What is not a setting\n\n- Site admins are rows of `admin_grant`, edited under Config > Access, with `ADMIN_DISCORD_IDS` as the bootstrap.\n- Discord role bindings are rows of `discord_role_binding`.\n- `signups_open`, `scheduling_enabled` and `checkin_enabled` are columns on the season, one switch per event.\n- The season's phase is derived and never stored.\n\n# The W3Champions season pin stays\n\nThe derived default is wrong on the one day it matters: when a new W3Champions season opens, a blank pin follows it at once and every player reads as zero games. A stored value is a deliberate choice and must keep winning over the derived one. Never propose auto-following the latest season, a staleness warning, or clearing the row. The seasonal hand edit is an accepted cost. See [the decision](../decisions/season-boundary-manual.md).\n\n# Routes\n\n`GET /config/settings` and `GET /config/settings/{key}` are open reads. `PUT /config/settings`, `PUT /config/settings/{key}` and `DELETE /config/settings/{key}` are admin writes. `GET /config/w3c` shows the URL and season the backend resolved. `POST /config/koth/nightbot-token` generates the Twitch token.", "concepts/vocabulary": "# The ladder of things\n\nLeague > event > stage > round > fixture > series > game.\n\n| Word | Meaning | Table |\n|---|---|---|\n| League | What repeats: Gym Newbie League (GNL), Gym KOTH, a community league. Holds defaults and history. `kind` is `gnl`, `koth` or `custom`. | `league` |\n| Event | One run of a league that people sign up for: a GNL season, a KOTH night, a cup, a sign-up list. `kind` is `gnl`, `cup`, `koth` or `signup`. | `event` (the class is still named `Season`) |\n| Stage | One format played over the entrants: `round_robin`, `gnl`, `single_elimination`, `double_elimination`, `swiss`, `koth`, `ffa`. Stages play in order; the next takes the top N of the last. | `event_stage` |\n| Round | One ordered group of series inside a stage, with an optional date window. A GNL week is a round. | `event_round` |\n| Fixture | The pairing of two team entrants in a round. It holds series. A GNL week has one fixture per team pairing. | `matches` |\n| Series | One opponent per side and a best-of. A 2v2 Bo3 is one series with sides of two. Schedule, casts, bets, veto and reports attach here. | `series` |\n| Game | One map inside a series, with a winner. | `series_game` |\n| Division | A band of entrants that runs the whole event in parallel and never merges: KOTH's brackets, a beginner and a pro bracket. | `event_division` |\n| Group | A stage partition that merges at the next stage. | `event_entrant.group_no` |\n| Qualifier | A child event with its own entrant list, feeding its parent. | `event.parent_id` |\n| Entrant | Who competes in an event: a player, or a pre-made team. A drafted GNL team is a roster row, not an entrant. | `event_entrant` |\n| Side | The players on one side of a series, with a race each. | `series_side` |\n\n# Words with history\n\n- **Season** is the GNL word for a GNL event. The payloads keep `season_id`, `seasons`, `playday` and `phase`, and the class is `Season`, because the frontend, the WordPress shortcodes and the Discord cards read those names. The table underneath is `event`.\n- **Match** is the GNL admin word for a fixture. The table is `matches`. Never use \"match\" for a series in new text.\n- **Week** is deprecated in favour of round. A round has a number and a date window; \"week\" survives only in a few old field names.\n- **Team series** is never used. A fixture holds series.\n- **Fantasy Captain** is the person who drafts a fantasy team, in every user-facing string. The API field stays `captain_id`. This person is a member who owns a fantasy team, not a GNL team captain. See [roles](roles-and-permissions.md).\n- **Captain** is a GNL team captain: a seat in `team_season_captain` for one team in one season.\n- **KOTH** is King of the Hill: one night, three MMR brackets, a chain of challengers per bracket. See [KOTH](koth.md).\n- **W3C** and **w3champions** are the ranked 1v1 ladder service the app reads MMR and matches from. The page is called \"W3C Ladder\", never \"Ladder\", because people also play the Battle.net ladder.\n\n# Races\n\n`Race` is an enumeration of the four races plus Random. A player signs a season up on one race, the **signup race**, which is the race the league scores them on. Their profile `race` is a cosmetic main race and a form default; it decides nothing. A series may record a per-side **off race** when a player played another race in that one series. See [series reporting](series-reporting.md).", "concepts/w3champions": "# What is read\n\n| Data | Endpoint family | Stored in | Trigger |\n|---|---|---|---|\n| MMR and wins and losses per race and season | player stats | `w3cstats`, `users.w3c_synced_at`, `users.mmr` | the Sync W3C buttons, `POST /users/{id}/w3c-sync`, `POST /teams/{id}/seasons/{id}/w3c-sync`, `POST /seasons/{id}/w3c-sync`, the daily job |\n| ranked 1v1 matches | match search, 100 per page | `w3c_ladder_matches`, the `ladder_sync` ledger | the Sync Ladder button, `POST /seasons/{id}/ladder-sync` in chunks, the daily job |\n| the season list | ladder seasons | nothing; read when `current_w3c_season` is unset | on demand |\n| the 1v1 map pool | maps | `maps`, paired with warcraft3.info by name and version | the ladder map import |\n\nThe base URL is the `w3c_url` setting, else the `W3C_URL` variable, else the built-in default. Every call has a 10 second timeout. A refused burst raises `W3CThrottledError`, which answers 502 with a fixed message and logs at warning, not error: the other side pacing the app is not an incident.\n\n# Facts that cost time to learn\n\n- Season ids carry no dates. To find a player's matches in a window, walk the season ids backwards; a search without a season id answers nothing.\n- The search filters on the race a player selected, and Random is a selected race. Store both the selected race and the rolled race per side.\n- Offset paging has been seen to drop a row; a one-game difference against another source is not a bug here.\n- A placement match carries no MMR at either end; it is unrated, not missing.\n- MMR carries across a season boundary unchanged.\n\n# The season pin\n\n`current_w3c_season` pins the season the MMR columns read. It is a hand edit, on purpose. See [settings](settings-and-current-season.md).\n\n# Load\n\nA full season ladder sync outlives the function limit, so the route takes `offset` and `limit` and answers `next_offset`. The daily job drains the stalest players first for 50 seconds. The manual buttons have no throttle by decision.", "conventions/code-style": "# Toolchain\n\n- Python 3.13 or newer. `requires-python` has a floor and no ceiling: the deployed version is pinned by the runtime, not by the project file.\n- `uv` manages the interpreter, the virtual environment and the lock file. Run everything through `uv run`, including one-off scripts. The system `python3` is older than the floor and fails on the syntax.\n- `just` runs the recipes. The dev dependencies install it as `rust-just`, so `uv run just <recipe>` works without a system install.\n\n# Lint and types\n\n- `uv run just lint` runs `ruff format --check` and `ruff check`. CI runs the same recipe. `extend-select = [\"ANN\", \"N\", \"FURB\"]` means every function is annotated, names follow PEP 8, and refurb's modernisations apply.\n- `uv run just typecheck` runs `ty` over `app` and `tests`. It is its own CI job, kept apart from lint because a type failure needs thought and a lint failure fixes itself with `just fmt`.\n- `[tool.ty.rules]` is a ratchet. A rule sits at `ignore` while it still fails; each one flips to `error` in its own pull request once its diagnostics are fixed. Never flip a rule back to `ignore`.\n- SQLModel types a class attribute as its instance value. Three helpers give an expression its real type: `sqlmodel.col()` at a column site, `app.core.db.rel()` at a loader option, `app.models.base.ident()` for a stored row's id. Use them in new code; ty flags the omission.\n\n# Typing\n\n- `X | None`, never `Optional`. `list[X]` and `dict[K, V]`, never `List` and `Dict`. `collections.abc` for `Sequence`, `Iterable` and `Iterator`.\n- One exception: a SQLModel `Relationship` whose target class is importable only under `TYPE_CHECKING` keeps `Optional[\"X\"]`. Quoting the whole union (`\"X | None\"`) breaks every mapper. See [the pitfall](../pitfalls/sqlmodel-relationship-quoting.md).\n- A function that hands an arbitrary value through is a PEP 695 generic, `def f[T](value: T) -> str | T`, not `Any`. `Any` is fine inside a container type such as `dict[str, Any]`.\n- The only `typing` imports in the app are `Any`, `TYPE_CHECKING`, `Annotated`, `Self` and `cast`.\n\n# Comments and prose\n\n- A comment describes the current state in the present tense. It never says \"previously\", \"we used to\", or \"TODO\". What changed and why belongs in the pull request.\n- A comment fits on one line, as a trailing tag where it can: `extend-select = [\"ANN\"]  # flake8-annotations`. Two lines is the ceiling. A paragraph belongs in a document.\n- Docstrings follow the same rule. A module docstring says what the module does and what a caller must do or must not do.\n- Every piece of prose, in code, in pull requests and in this bundle, uses plain words and short sentences. See [the writing rule](okf-bundle.md).\n- Use the words the code uses today: \"Public models\", \"model families\", \"eager-load options\". Not \"DTO\", not \"schemas layer\". The events vocabulary is in [vocabulary](../concepts/vocabulary.md).\n\n# What not to add\n\n- No `scripts/` folder. An operational step is a `just` recipe that imports the app and calls the real service, so the shipped path is what runs. See [runbooks](../runbooks/index.md).\n- No configuration knob that restates a library default. State the default in a comment instead. Keep only a setting that differs from the default and has a reason on the same line.\n- No fix at the symptom layer. A memory problem is fixed in the query, not with a garbage-collector call per request. A runtime mitigation that is really needed goes in operations configuration, never in application code.\n- No hand-written parser over a binary format the app does not own. Reading a documented header is fine; walking records is not, without approval.", "conventions/git-and-pull-requests": "# Branches\n\n- Nothing is committed to `main` directly. Every change is a branch and a pull request with base `main`.\n- Branch prefixes: `feature/`, `fix/`, `refactor/`, `chore/`. `chore/` is trivial upkeep only (a version bump, formatting). A new capability, including a new test suite or tooling, is `feature/`.\n- Pull requests are squash merged. The pull request title and body become the commit on `main`, so write the body as the commit message: a plain summary paragraph first, short sections after it.\n- A pull request references an issue as `Issue #37` or `Part of #37`. It never uses a closing keyword such as `Closes #37`: the issue stays open until the change is reviewed on production.\n\n# Attribution\n\n- Text an AI agent wrote in a pull request body starts with a note saying so. A commit an agent co-wrote ends with a `Co-Authored-By` trailer. The commit author is always the person whose clone made the commit; never override the author.\n- Never claim that a person reviewed or approved something they did not.\n\n# Migrations\n\n- Alembic owns the schema. A model change ships with its migration, and `tests/test_migrations.py` fails when the migrated schema and the models differ.\n- The production build runs `alembic upgrade head` while the previous deployment keeps serving. Every migration must work with the code before it and the code after it: add a column nullable or with a default; drop a column, or change its type, only in a later pull request, merged after the code that stopped reading it is live. See [the pitfall](../pitfalls/column-drop-two-deploys.md).\n- One migration in flight at a time. Two open pull requests that both add a migration produce two Alembic heads on `main` after the second squash, which breaks CI and the staging migrate job. After merging `main` into a branch that carries a migration, run `uv run alembic heads` and re-point the revision before pushing.\n- A pull request with a migration builds its preview against its own copy of the staging database. See [preview databases](../../PREVIEW-DATABASES.md).\n\n# Checks before a merge\n\n- CI runs lint, typecheck, a runtime-only import check and the tests on every pull request. `main` should be green by construction.\n- A Vercel preview check that fails with a daily build quota message is not a code failure and does not block a merge. A check that names a real build error does.\n- When two open pull requests touch one module, refresh the second from `main` and let CI run again before merging it.", "conventions/layering": "# The three layers\n\n| Layer | Where | What it does |\n|---|---|---|\n| Routes | `app/api/routes/*.py` | One module per API area. A route validates the request through a typed body model, picks the guard, calls one service method, and returns a Public model. No SQL here. |\n| Services | `app/services/*.py` | One service per entity, plus a few that compute across entities. A service opens its own session with `Session.begin()`, one transaction per call, and never commits by hand. To share a transaction, pass the session down. |\n| Models | `app/models/*.py` | SQLModel table classes and their request and response shapes. See [model families](../data/model-families.md). |\n\n`app/core/` holds what is neither a route nor a service: the engine, the query language of the search routes, the exceptions, the security helpers, and the pure rules (scoring, career rating, fantasy, ladder, achievements, brackets, divisions). A pure rule reads no database. Where a rule has a SQL face and a Python face, a test pins the two to each other.\n\n# The application factory\n\n`create_app` in `app/main.py` builds the engine and registers the routers. Importing any app module opens no connection and creates no table; the tables come from `alembic upgrade head` before the server starts. The server calls the factory: `uvicorn --factory app.main:create_app`. Vercel imports `api/index.py`, which calls the same factory.\n\n`create_app` reads the process environment only. No `.env` file is read below the entry points; `api/index.py` and the `just` modules load one. The tests therefore never see a laptop's `.env`.\n\n# The service graph\n\n`app/api/deps.py` builds one instance of every service for the process and exposes each as an `Annotated` dependency, `SeasonServiceDep` and so on. Services are stateless besides their references to each other. Building them touches no database.\n\nThe same module holds the guards: `require_login`, `require_member`, `require_captain`, `require_admin`, `optional_login`. See [authentication](../api/auth.md).\n\n# Sync, not async\n\nRoute handlers and services are plain `def`. FastAPI runs them in a thread pool. The SQLAlchemy layer blocks, so `async def` around it would be worse, not better.\n\n# Errors\n\nA service raises `NotFoundError`, `BadRequestError`, `ExternalServiceError` or `ApiError`. `create_app` turns each into the one error envelope every client reads. See [the API overview](../api/overview.md). Never add a handler that leaks `str(e)` from an unknown exception.\n\n# Derived, not stored\n\nPoints, standings, career totals and fantasy scores are computed at read time from the map scores. No column holds a rollup, and there is no recalculate button. See [derived scores](../concepts/derived-scores.md) and [the decision](../decisions/derived-not-stored.md).", "conventions/okf-bundle": "# What this bundle is\n\n`docs/okf/` is an Open Knowledge Format (OKF) bundle: a directory of markdown files with YAML frontmatter, readable by a person and by an AI agent. Each file is one concept. The file path is the concept id. `index.md` lists a directory and `log.md` records changes; every other `.md` file is a concept.\n\nThe bundle exists so that a new contributor, human or agent, can read how the app works, why it works that way, and which mistakes were already made, without asking the people who built it.\n\n# Frontmatter\n\nEvery concept starts with a YAML block. `type` is required. The types this bundle uses:\n\n| type | What the file holds |\n|---|---|\n| Repository | the one overview of this repository |\n| Convention | a rule the code follows |\n| Domain Concept | a thing the league runs on, and how the app models it |\n| Data Model | tables and model families |\n| API Area | a group of routes and their rules |\n| Integration | how this repository talks to a service outside it |\n| Runbook | steps to do one operational task |\n| Decision | a choice that was made, when, and why it stands |\n| Pitfall | a mistake that was made once, and how to not repeat it |\n\nThe other fields: `title`, `description` (one sentence), `tags`, `generated: { by, at }` (who wrote the current text and when), `verified: [{ by, at }]` (who checked it against the code), `status` (`draft`, `stable` by default, `deprecated`), `stale_after`, and `sources` (what the text was written from).\n\n`generated.by` names the writer: `human:<github handle>` for a person, `<tool>/<model>` for an agent. A concept with no `verified` entry is unverified. When a maintainer reads a concept against the code and finds it true, they add a `verified` entry with their own handle. Nobody adds one for someone else.\n\n# Sources and links\n\nA concept names what it was written from in `sources`. A source inside this repository is a relative path from the concept file, for example `../../../app/api/deps.py`, so the link works on GitHub and survives a rename of the repository. A source outside the repository is a URL, or a short description when there is no URL, for example `Maintainers' decision, 2026-09-08`.\n\nLinks between concepts are relative markdown links, for example `../decisions/derived-not-stored.md`. The OKF spec prefers bundle-absolute links that start with `/`. This bundle uses relative links because GitHub renders them and bundle-absolute ones break there.\n\n# The one rule about other repositories\n\nThe app is three repositories: the backend, the frontend and the Discord adapter. Each has its own bundle. A bundle describes only what its own repository proves, plus the decisions that shaped it.\n\nA shared fact is owned by one repository:\n\n- the backend owns the domain model, the API contract, the roles, the settings keys and the environment variable names it reads;\n- the frontend owns its pages, its design rules and the way it consumes the API;\n- the Discord adapter owns the interaction handshake and the cron worker.\n\nAnother repository is named only through its contract: an HTTP route, a header, a query parameter, an environment variable name, a Discord payload shape. Never a file path into another repository, and never a link to a file in another bundle. Those paths move without telling anyone.\n\nEach bundle's `index.md` has one section, \"Neighbouring bundles\", that names the other repositories by their GitHub root. That is the only cross-repository pointer, one line per neighbour, so a moved repository costs one line in each neighbour.\n\nWhere a concept must be understood on both sides, the consuming repository writes a short \"as consumed here\" concept that names the fields it relies on, and says in prose which repository owns the definition. It does not copy the definition.\n\nTests keep the two sides in step, not prose. The backend pins the response shapes its consumers read in `tests/test_public_contract.py`, `tests/test_contract.py`, `tests/test_gnl_snapshot.py` and `tests/test_error_envelope.py`. A change to one of those tests is a change to a contract and needs a change in a consumer.\n\n# Writing\n\nWrite short sentences: one fact per sentence, the present tense, the active voice. Say what is, not what used to be. A decision says when it was made and why. Never name a person and never quote one: write \"the maintainers\" and summarise what was concluded.\n\nThe bundle is public. Never write a secret, a token, a database URL, an account or guild id, or any detail about a person into it. The full list of what never goes in, and the check to run before a commit, is [`AGENTS.md`](../../../AGENTS.md) at the repository root.\n\n# Keeping it true\n\n- A pull request that changes a fact this bundle states changes the concept in the same pull request and updates `generated.at`.\n- A concept that no longer holds gets `status: deprecated` and one line naming what replaced it. It is not deleted, so links keep working.\n- `log.md` gets one line per change, newest first.\n- `index.html` beside the root `index.md` is the graph viewer from the OKF reference repository, served by GitHub Pages from `docs/`; `just okf-graph` regenerates it after a change to the bundle. It carries a no-index tag and is not a concept.\n- `uv run just test` runs `tests/test_okf.py`. It checks that every concept has a `type`, that `index.md` files carry no frontmatter except the root one, and that every relative link resolves to a file.", "conventions/testing": "# How the suite runs\n\n- `uv run just test` runs pytest the way CI does. Pass pytest arguments through: `uv run just test -k koth`.\n- The suite builds a temporary SQLite file with `alembic upgrade head`, the same command a deployment runs, so every run also checks the migrations. Tests share one database and a fixture empties it between tests.\n- `tests/conftest.py` is the only module that imports the web framework. Every test asserts on status codes and JSON through the `client` fixture, or calls a service directly.\n- The suite opens no socket. A fixture fails any outgoing call a test did not stand in for. An environment key that turns a network call on (`DISCORD_BOT_TOKEN`, `DB_URL`) is removed from the process at import time in `conftest.py`. Never add `load_dotenv` to a module the tests import.\n- To run the same suite on Postgres, set `TEST_DB_URL` to a server whose user may create databases. Postgres-only questions (collation, casting, sequences) are settled there, not on SQLite.\n\n# Guard tests\n\nThese tests encode a lesson each. Keep them green and extend them when the lesson applies to new code.\n\n| Test | What it guards |\n|---|---|\n| `test_migrations.py` | the models and the migrated schema describe the
